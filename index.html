  <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Frameo  — YouTube Size Canvas</title>

<style>
:root{
  --radius:.75rem;
  --background:#2c2620;
  --foreground:#f2ede0;
  --card:#3a3128;
  --secondary:#453a2f;
  --muted-foreground:#b8ab97;
  --accent:#e6a559;
  --accent-foreground:#2b1c0d;
  --destructive:#d9694f;
  --border:#55483a;
  --shadow-panel:0 10px 30px -12px rgba(0,0,0,.7);
  --font-display:"Arial Narrow",Arial,sans-serif;
  --app-height:100vh;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;}
html, body{height:100%;overflow:hidden;}
body{margin:0;background:var(--background);color:var(--foreground);font-family:Arial,system-ui,sans-serif;overscroll-behavior:none;}
button{font:inherit;cursor:pointer;}
.hidden{display:none!important;}
#app{display:flex;flex-direction:column;height:var(--app-height);overflow:hidden;}
.font-display{font-family:var(--font-display);letter-spacing:.03em;}

.topbar{display:flex;align-items:center;gap:.4rem;border-bottom:1px solid rgba(255,255,255,.08);padding:.5rem .75rem;position:relative;}
.title-block{margin-right:auto;}
.title-block h1{font-size:1rem;line-height:1;margin:0;}
.title-block p{margin:.15rem 0 0;font-size:.625rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted-foreground);}

main{flex:1;display:flex;flex-direction:column;gap:.5rem;padding:.5rem;min-height:0;overflow:hidden;}
.top-fixed{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;}
.scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:.5rem;}
.panel{border-radius:var(--radius);background:var(--card);border:1px solid var(--border);padding:.75rem;box-shadow:var(--shadow-panel);}
.label{font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:.25rem;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);background:var(--secondary);color:var(--foreground);padding:.4rem .55rem;font-size:.68rem;font-weight:600;white-space: nowrap;}
.chip:active{transform:scale(.96);}
.chip-on,.chip-accent{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent);}
.chip-danger{color:var(--destructive);border-color:rgba(217,105,79,.45);}
.chip.flex-1{flex:1;}
.ml-auto{margin-left:auto;}
.w-full{width:100%;}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:999px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);font-size:.8rem;}
.icon-btn:disabled{opacity:.35;}
.icon-btn-accent{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent);}

.tool-item{position:relative;display:inline-flex;align-items:center;}
.color-picker-dropdown{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:.4rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem;box-shadow:var(--shadow-panel);display:flex;flex-direction:column;gap:.5rem;z-index:100;width:180px;}
.color-picker-dropdown.hidden{display:none;}

.stage-row{display:flex;}
.stage-wrap{position:relative;flex:1;min-width:0;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-panel);background:var(--background);touch-action:none;display:flex;align-items:center;justify-content:center;}
.stage{display:block;background:#ffffff;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 4px 20px rgba(0,0,0,0.3);}

.tool-rail{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);padding:.5rem;box-shadow:var(--shadow-panel);}
.tool-rail.tool-rail--shapes{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;}
.quick-shape-thumb{flex:0 0 auto;width:2.6rem;height:2.6rem;padding:2px;}
.quick-shape-thumb img{width:100%;height:100%;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.85);}

.transport{display:flex;align-items:center;gap:.3rem;padding:.4rem .5rem;flex-wrap:nowrap;justify-content:space-between;}
.transport-left{display:flex;align-items:center;gap:.25rem;}
.transport-right{display:flex;align-items:center;gap:.25rem;}
.frame-counter{font-size:.7rem;color:var(--muted-foreground);white-space:nowrap;margin:0 .2rem;}
.frame-counter span{color:var(--foreground);}

.timeline-controls{display:flex;align-items:center;gap:.3rem;padding:.4rem .5rem;flex-wrap:wrap;}
.timeline-controls .chip-xs{flex:1 1 auto;min-width:0;padding:.32rem .1rem;font-size:.58rem;gap:.1rem;overflow:hidden;text-overflow:ellipsis;}

.timeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;gap:.2rem;padding-bottom:2px;}
.timeline-head::-webkit-scrollbar{display:none;}
.chip-xs{flex:1 1 0;min-width:0;padding:.32rem .1rem;font-size:.58rem;gap:.1rem;overflow:hidden;text-overflow:ellipsis;}

.xsheet-wrap{--audio-row-h:34px;overflow-x:auto;overflow-y:visible;border-radius:8px;border:1px solid var(--border);background:var(--secondary);-webkit-overflow-scrolling:touch;position:relative;}
.xsheet-table{display:flex;flex-direction:column;min-width:max-content;}
.xsheet-header-row,.xsheet-row{display:flex;height:34px;}
.xsheet-header-row{position:sticky;top:var(--audio-row-h);z-index:25;background:var(--card);border-bottom:1px solid var(--border);}
.xsheet-corner{position:sticky;left:0;z-index:26;width:110px;min-width:110px;background:var(--card);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;}
.xsheet-colheads{display:flex;}
.xsheet-colhead{width:36px;min-width:36px;border-right:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--muted-foreground);cursor:pointer;}
.xsheet-colhead.current{color:var(--accent);font-weight:700;background:rgba(230,165,89,.1);}
.xsheet-row{border-bottom:1px solid rgba(255,255,255,.05);}
.xsheet-rowhead{position:sticky;left:0;z-index:5;width:110px;min-width:110px;background:var(--card);border-right:1px solid var(--border);display:flex;align-items:center;gap:.2rem;padding:0 4px;}
.xsheet-rowhead.active{background:#473a2f;}
.xsheet-rowhead .visbtn{flex:0 0 auto;width:1.1rem;height:1.1rem;border-radius:3px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font-size:.55rem;display:flex;align-items:center;justify-content:center;padding:0;}
.xsheet-rowhead .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:none;color:inherit;font-size:.62rem;padding:.1rem;}
.xsheet-cells{display:flex;position:relative;z-index:0;}
.xsheet-cell{width:36px;min-width:36px;border-right:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;position:relative;background:var(--secondary);padding:0;cursor:pointer;}
.xsheet-cell:active{background:rgba(230,165,89,.2);}
.xsheet-cell.current-frame{background:rgba(230,165,89,.08);}
.xsheet-cell.active-cell{outline:2px solid var(--accent);outline-offset:-2px;z-index:2;}
.xsheet-dot{width:7px;height:7px;border-radius:999px;background:var(--accent);}
.xsheet-kf-line{position:absolute;top:50%;height:2px;background:rgba(230,165,89,.55);transform:translateY(-50%);pointer-events:none;z-index:1;}
.xsheet-kf-diamond{width:9px;height:9px;background:var(--accent);border:1px solid #2b1c0d;transform:rotate(45deg);position:relative;z-index:2;}
.xsheet-kf-diamond.selected{background:#ffffff;}

.audio-track-row{display:flex;height:var(--audio-row-h);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.16);position:sticky;top:0;z-index:30;}
.audio-track-rowhead{position:sticky;left:0;z-index:60;width:110px;min-width:110px;background:var(--card);border-right:1px solid var(--border);display:flex;align-items:center;gap:.2rem;padding:0 4px;font-size:.62rem;}
.audio-track-rowhead .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.audio-track-lane{position:relative;height:var(--audio-row-h);flex:0 0 auto;isolation:isolate;background:repeating-linear-gradient(90deg,transparent 0 35px,rgba(255,255,255,.05) 35px 36px);touch-action:none;}
.audio-clip{position:absolute;top:2px;height:calc(var(--audio-row-h) - 4px);border-radius:4px;background:rgba(255,140,43,.18);border:1px solid rgba(255,140,43,.5);overflow:hidden;touch-action:none;cursor:grab;}
.audio-clip.selected{border-color:#ffd7a1;box-shadow:0 0 0 2px rgba(255,215,161,.55);background:rgba(255,140,43,.28);}
.audio-clip canvas{display:block;width:100%;height:100%;pointer-events:none;}
.audio-clip .clip-name{position:absolute;left:10px;top:1px;font-size:.5rem;color:#ffe6cc;pointer-events:none;white-space:nowrap;overflow:hidden;max-width:calc(100% - 20px);}
.audio-split-btn{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:.6rem;line-height:1;padding:2px 6px;border-radius:10px;border:1px solid #ffd7a1;background:#241a12;color:#ffd7a1;z-index:45;cursor:pointer;}
.audio-split-marker{position:absolute;top:0;height:100%;width:0;z-index:40;touch-action:none;}
.audio-split-marker .line{position:absolute;left:-1px;top:0;width:2px;height:100%;background:#ffd7a1;box-shadow:0 0 4px rgba(255,215,161,.8);pointer-events:none;}
.audio-split-marker .knob{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);font-size:.6rem;line-height:1;padding:2px 5px;border-radius:10px;border:1px solid #ffd7a1;background:#241a12;color:#ffd7a1;cursor:ew-resize;white-space:nowrap;}
.audio-playhead{position:absolute;top:0;width:2px;height:100%;background:var(--accent);pointer-events:none;z-index:50;touch-action:none;}
.audio-playhead .ph-grip{position:absolute;left:1px;top:0;width:22px;height:100%;transform:translateX(-50%);pointer-events:auto;cursor:ew-resize;touch-action:none;background:transparent;}
.audio-playhead .ph-knob{position:absolute;left:1px;top:1px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px rgba(0,0,0,.6);pointer-events:none;}
.audio-playhead.dragging .ph-knob{transform:translateX(-50%) scale(1.25);}



.layer-popup-menu{position:fixed;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow-panel);width:90%;max-width:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1000;display:flex;flex-direction:column;gap:.5rem;}
.layer-popup-menu.hidden{display:none;}
.layer-item-box{background:var(--secondary);border:1px solid var(--border);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.layer-item-row{display:flex;align-items:center;gap:4px;}

.swatch-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;}
.swatch{width:1.7rem;height:1.7rem;border-radius:999px;border:2px solid var(--border);padding:0;}
.swatch-on{border-color:var(--accent);transform:scale(1.12);}

input[type=range]{width:100%;accent-color:var(--accent);touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;padding:0;margin:0;display:block;vertical-align:middle;}
#panelContent input[type=range]{width:78%;}
.field{margin-top:.75rem;}
.field:first-child{margin-top:0;}
.stepper-row{display:flex;align-items:center;gap:.35rem;margin-top:.35rem;}
.stepper-btn{flex:0 0 auto;width:1.9rem;height:1.9rem;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;line-height:1;}
.stepper-input{flex:1;min-width:0;text-align:center;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:6px;padding:.3rem .2rem;font-size:.7rem;font-family:inherit;-moz-appearance:textfield;}
.stepper-input::-webkit-outer-spin-button,.stepper-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.export-dropdown{position:absolute;top:100%;right:.5rem;z-index:100;width:240px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.5rem;box-shadow:var(--shadow-panel);}
.export-dropdown.hidden{display:none;}
.export-overlay{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(44,38,32,.85);backdrop-filter:blur(4px);}
.export-overlay.hidden{display:none;}
.export-overlay .panel{text-align:center;}
.export-hint{margin:.35rem 0 0;font-size:.72rem;color:var(--muted-foreground);}
.compact-btn{padding:.2rem .35rem;font-size:.6rem;}

/* ---------- Project Gallery ---------- */
.gallery-overlay{position:fixed;inset:0;z-index:200;background:var(--background,#1c1917);overflow:auto;padding:.75rem;}
.gallery-overlay.hidden{display:none;}
.gallery-top{display:flex;align-items:center;gap:.4rem;margin-bottom:.75rem;flex-wrap:wrap;}
.gallery-top h2{font-size:1rem;margin:0;flex:1;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;}
.proj-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;}
.proj-card.current{border-color:var(--primary,#ff8a3d);}
.proj-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;}
.proj-meta{padding:.35rem .45rem;}
.proj-name{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-date{font-size:.6rem;color:var(--muted-foreground);}
.proj-menu-btn{position:absolute;top:.25rem;right:.25rem;width:1.5rem;height:1.5rem;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;line-height:1;cursor:pointer;}
.proj-menu{position:absolute;top:1.9rem;right:.25rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);z-index:5;overflow:hidden;min-width:110px;}
.proj-menu button{display:block;width:100%;padding:.4rem .5rem;background:none;border:none;color:inherit;font-size:.7rem;text-align:left;cursor:pointer;}
.proj-menu button:hover{background:rgba(255,255,255,.08);}
.gallery-empty{color:var(--muted-foreground);font-size:.8rem;padding:2rem 0;text-align:center;}

@media(max-width:420px){.icon-btn{width:2rem;height:2rem;font-size:.75rem;}}

</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<body>
<div id="authOverlay" style="position:fixed;inset:0;z-index:9999;background:#2c2620;display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div style="width:100%;max-width:340px;background:#3a3128;border:1px solid #55483a;border-radius:12px;padding:1.5rem;color:#f2ede0;font-family:Arial,sans-serif;">
    <h2 id="authTitle" style="margin:0 0 1rem;text-align:center;">লগইন করুন</h2>

    <div id="authRegisterFields" style="display:none;">
      <input id="authName" type="text" placeholder="নাম" style="width:100%;padding:.6rem;margin-bottom:.6rem;border-radius:6px;border:1px solid #55483a;background:#453a2f;color:#f2ede0;box-sizing:border-box;" />
    </div>
    <input id="authEmail" type="email" placeholder="ইমেইল" style="width:100%;padding:.6rem;margin-bottom:.6rem;border-radius:6px;border:1px solid #55483a;background:#453a2f;color:#f2ede0;box-sizing:border-box;" />
    <input id="authPassword" type="password" placeholder="পাসওয়ার্ড" style="width:100%;padding:.6rem;margin-bottom:.6rem;border-radius:6px;border:1px solid #55483a;background:#453a2f;color:#f2ede0;box-sizing:border-box;" />

    <div id="authError" style="color:#d9694f;font-size:.75rem;margin-bottom:.6rem;display:none;"></div>

    <button id="authSubmitBtn" style="width:100%;padding:.7rem;border:none;border-radius:6px;background:#e6a559;color:#2b1c0d;font-weight:700;margin-bottom:.6rem;">লগইন</button>

    <div style="text-align:center;font-size:.8rem;">
      <span id="authToggleText">অ্যাকাউন্ট নেই? </span>
      <a href="#" id="authToggleLink" style="color:#e6a559;">রেজিস্ট্রেশন করুন</a>
    </div>
  </div>
</div>
<div id="app" class="hidden">

<header class="topbar">
  <div class="title-block">
    <h1 class="font-display">FRAMEO </h1>
  </div>

  <button id="btnUndo" class="icon-btn">↶</button>
  <button id="btnRedo" class="icon-btn">↷</button>
  <button id="btnProjects" class="chip compact-btn">📁 Files</button>
  <button id="btnImportAudio" class="chip compact-btn">+ Audio</button>
  <button id="btnImportGallery" class="chip compact-btn">+Gallery</button>
  <button id="btnExportTab" class="chip chip-accent compact-btn">Export</button>

  <div id="exportDropdown" class="export-dropdown hidden">
    <button id="b4k" class="chip w-full chip-accent" style="margin-bottom:.35rem;">Export MP4 — YouTube 4K</button>
    <button id="b1080" class="chip w-full" style="margin-bottom:.35rem;">Export MP4 — YouTube 1080p</button>
    <button id="bpng" class="chip w-full">Export PNG Frame</button>
  </div>
</header>

<main>
  <div class="top-fixed">
    <div class="stage-row">
      <div class="stage-wrap" id="stageWrap">
        <canvas id="canvas" class="stage"></canvas>
      </div>
    </div>

    <div class="tool-rail" id="toolRail"></div>

    <div class="panel" style="display:flex;flex-direction:column;gap:.25rem;padding:.5rem .6rem;">
      <div class="transport">
        <div class="transport-left">
          <button id="btnFirst" class="icon-btn">⏮</button>
          <button id="btnPrev" class="icon-btn">◀</button>
          <button id="btnPlay" class="icon-btn icon-btn-accent">▶</button>
          <button id="btnNext" class="icon-btn">▶</button>
          <div class="frame-counter">
            <span id="frameCur">1</span>/<span id="frameTotal">1</span>
          </div>
        </div>

        <div class="transport-right">
          <div class="tool-item" style="display:inline-flex;">
            <button id="btnFpsToggle" class="chip" style="padding: 0.2rem 0.35rem; font-size: 0.6rem;">FPS: 12</button>
            <div id="fpsDropdown" class="color-picker-dropdown hidden" style="width: 170px;">
              <div class="field" style="margin:0;">
                <div class="label" id="fpsLabel">Rate: 12 fps</div>
                <input type="range" id="fpsRange" min="2" max="60" value="12" style="width:100%; margin-top:4px;" />
                <div class="stepper-row" id="fpsStepperRow"></div>
              </div>
            </div>
          </div>
          <div class="tool-item" style="display:inline-flex;">
            <button id="btnOnion" class="chip" style="padding: 0.2rem 0.35rem; font-size: 0.6rem;">Onion</button>
            <div id="onionDropdown" class="color-picker-dropdown hidden" style="width: 190px;">
              <div class="field" style="margin:0;">
                <button id="btnOnionToggle" class="chip w-full" style="margin-bottom:.5rem;">Onion: ON</button>
                <div class="label">Before frames: <span id="onionBeforeLabel">1</span></div>
                <div class="stepper-row" id="onionBeforeStepperRow"></div>
                <div class="label" style="margin-top:.5rem;">After frames: <span id="onionAfterLabel">1</span></div>
                <div class="stepper-row" id="onionAfterStepperRow"></div>
              </div>
            </div>
          </div>
          <button id="btnLoop" class="chip" style="padding: 0.2rem 0.35rem; font-size: 0.6rem;">Loop</button>
        </div>
      </div>

      <div class="timeline-controls" style="border-top:1px solid rgba(255,255,255,.08);padding-top:.3rem;">
        <button id="btnAddKeyframeTop" class="chip chip-xs chip-accent hidden">+KF</button>
        <button id="btnAddFrame" class="chip chip-xs">+Frame</button>
        <button id="btnDupFrame" class="chip chip-xs">Dup</button>
        <button id="btnCopy" class="chip chip-xs">Copy</button>
        <button id="btnPaste" class="chip chip-xs">Paste</button>
        <button id="btnClear" class="chip chip-xs">Clear</button>
        <button id="btnDelFrame" class="chip chip-xs chip-danger">Del</button>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <div class="panel">
      <div class="xsheet-wrap" id="xsheetWrap">
        <div class="xsheet-table" id="timelineStrip"></div>
      </div>
    </div>

    <div id="panelContent"></div>
  </div>
</main>

<div id="galleryOverlay" class="gallery-overlay hidden">
  <div class="gallery-top">
    <h2 class="font-display">My Projects</h2>
    <button id="btnGalleryUpdate" class="chip compact-btn hidden">⬆ Update</button>
    <button id="btnGallerySaveAs" class="chip compact-btn">💾 Save As</button>

    <button id="btnGalleryNew" class="chip chip-accent compact-btn">+ New Project</button>
    <button id="btnGalleryClose" class="chip compact-btn">✕ Close</button>
  </div>
  
 
  <div id="galleryGrid" class="gallery-grid"></div>
  <div id="galleryEmpty" class="gallery-empty hidden">এখনো কোনো প্রজেক্ট সেভ করা হয়নি।</div>
</div>

<div id="exportOverlay" class="export-overlay hidden">
  <div class="panel">
    <div class="font-display" id="exportLabel" style="font-size:1.125rem"></div>
    <p class="export-hint">ট্যাব খোলা রাখুন — ফাইল নিজে থেকেই ডাউনলোড হবে</p>
  </div>
</div>

const STAGE_H = 720;

const EASINGS = {
  linear:    t => t,
  easeIn:    t => t*t,
  easeOut:   t => t*(2-t),
  easeInOut: t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2,
  bounce:    t => {
    const n1=7.5625, d1=2.75;
    if(t < 1/d1) return n1*t*t;
    if(t < 2/d1){ t -= 1.5/d1; return n1*t*t + 0.75; }
    if(t < 2.5/d1){ t -= 2.25/d1; return n1*t*t + 0.9375; }
    t -= 2.625/d1; return n1*t*t + 0.984375;
  }
};
const EASING_LABELS = {
  linear:"Linear", easeIn:"Ease In", easeOut:"Ease Out",
  easeInOut:"Ease In-Out", bounce:"Bounce"
};

function cloneImageObjects(objs){
  return objs.map(o => ({
    ...o,
    keyframes: o.keyframes.map(k => ({ ...k })),
    shapes: (o.shapes||[]).map(s => ({ ...s })),
    shapeKeyframes: (o.shapeKeyframes||[]).map(k => ({ ...k }))
  }));
}

function sortedKeyframes(obj){
  return [...obj.keyframes].sort((a,b)=>a.frame-b.frame);
}

function dedupeIdenticalKeyframes(obj){
  const kfs = sortedKeyframes(obj);
  if(kfs.length<=1) return { ...obj, keyframes: kfs };

  const EPS = 1e-6;
  const same = (a,b) =>
    Math.abs(a.x-b.x)<EPS && Math.abs(a.y-b.y)<EPS &&
    Math.abs(a.w-b.w)<EPS && Math.abs(a.h-b.h)<EPS &&
    Math.abs(a.rotation-b.rotation)<EPS && Math.abs(a.opacity-b.opacity)<EPS &&
    !!a.flipX===!!b.flipX && !!a.flipY===!!b.flipY;

  const kept = [kfs[0]];
  for(let i=1; i<kfs.length; i++){
    if(!same(kept[kept.length-1], kfs[i])) kept.push(kfs[i]);
  }
  return { ...obj, keyframes: kept };
}

function dedupeOverlappingImageObjects(objs){
  const EPS = 0.02;
  const removed = new Set();

  for(let i=0; i<objs.length; i++){
    if(removed.has(objs[i].id)) continue;
    for(let j=i+1; j<objs.length; j++){
      if(removed.has(objs[j].id)) continue;
      const a = objs[i], b = objs[j];
      if(a.src !== b.src || a.layerId !== b.layerId) continue;

      const ta = a.keyframes[0], tb = b.keyframes[0];
      if(!ta || !tb) continue;

      const close =
        Math.abs(ta.x-tb.x)<EPS && Math.abs(ta.y-tb.y)<EPS &&
        Math.abs(ta.w-tb.w)<EPS && Math.abs(ta.h-tb.h)<EPS;

      if(close){
        const keepA = a.keyframes.length >= b.keyframes.length;
        removed.add(keepA ? b.id : a.id);
      }
    }
  }

  return objs.filter(o=>!removed.has(o.id));
}

function objectTransformAt(obj, frame){
  const kfs = sortedKeyframes(obj);
  if(!kfs.length) return null;
  if(frame <= kfs[0].frame) return kfs[0];
  if(frame >= kfs[kfs.length-1].frame) return kfs[kfs.length-1];

  let k1 = kfs[0], k2 = kfs[kfs.length-1];
  for(let i=0; i<kfs.length-1; i++){
    if(kfs[i].frame<=frame && kfs[i+1].frame>=frame){
      k1 = kfs[i]; k2 = kfs[i+1];
      break;
    }
  }
  if(k1.frame===k2.frame) return k1;

  const t0 = (frame-k1.frame)/(k2.frame-k1.frame);
  const ease = EASINGS[k1.easing] || EASINGS.linear;
  const t = ease(t0);

  return {
    frame,
    x: k1.x + (k2.x-k1.x)*t,
    y: k1.y + (k2.y-k1.y)*t,
    w: k1.w + (k2.w-k1.w)*t,
    h: k1.h + (k2.h-k1.h)*t,
    rotation: k1.rotation + (k2.rotation-k1.rotation)*t,
    opacity: k1.opacity + (k2.opacity-k1.opacity)*t,
    flipX: !!k1.flipX,
    flipY: !!k1.flipY
  };
}

function sortedShapeKeyframes(obj){
  return [...(obj.shapeKeyframes||[])].sort((a,b)=>a.frame-b.frame);
}

function getShapeById(obj, shapeId){
  if(!shapeId || shapeId==="base") return { id:"base", src:obj.src, natW:obj.natW, natH:obj.natH };
  const found = (obj.shapes||[]).find(s=>s.id===shapeId);
  return found ? { id:found.id, src:found.src, natW:found.natW, natH:found.natH } : { id:"base", src:obj.src, natW:obj.natW, natH:obj.natH };
}

function resolveActiveShape(obj, frame){
  const skfs = sortedShapeKeyframes(obj);
  if(!skfs.length) return getShapeById(obj, "base");
  const exact = skfs.find(k=>k.frame===frame);
  if(exact) return getShapeById(obj, exact.shapeId);
  return getShapeById(obj, "base");
}

function findObjectById(id){
  return S.imageObjects.find(o=>o.id===id) || null;
}

function clearDanglingParents(objs){
  const ids = new Set(objs.map(o=>o.id));
  return objs.map(o => (o.parentId && !ids.has(o.parentId)) ? { ...o, parentId: null, parentBindFrame: null } : o);
}

/* ---------- Pivot (anchor point) helpers ----------
   pivotX / pivotY are fractional (0..1) values of the object's bounding box.
   Default 0.5 / 0.5 = center. They are a per-object property (NOT animated
   per keyframe) so shape-swap keeps the anchor in the right relative place. */
function pivotOf(obj){
  const px = obj && Number.isFinite(obj.pivotX) ? Math.max(0, Math.min(1, obj.pivotX)) : 0.5;
  const py = obj && Number.isFinite(obj.pivotY) ? Math.max(0, Math.min(1, obj.pivotY)) : 0.5;
  return { px, py };
}

function pivotPointOf(obj, t){
  const p = pivotOf(obj);
  return { x: t.x + p.px*t.w, y: t.y + p.py*t.h };
}


function worldTransformAt(obj, frame, visited){
  const local = objectTransformAt(obj, frame);
  if(!local || !obj.parentId) return local;

  visited = visited ? new Set(visited) : new Set();
  if(visited.has(obj.id)) return local;
  visited.add(obj.id);

  const parentObj = findObjectById(obj.parentId);
  if(!parentObj) return local;

  const parentNow = worldTransformAt(parentObj, frame, visited);
  const bindFrame = Number.isFinite(obj.parentBindFrame) ? obj.parentBindFrame : frame;
  const parentBind = worldTransformAt(parentObj, bindFrame, visited);
  if(!parentNow || !parentBind) return local;

  const pPar = pivotOf(parentObj);
  const pSelf = pivotOf(obj);

  const cxNow = (parentNow.x + pPar.px*parentNow.w)*STAGE_W;
  const cyNow = (parentNow.y + pPar.py*parentNow.h)*STAGE_H;
  const cxBind = (parentBind.x + pPar.px*parentBind.w)*STAGE_W;
  const cyBind = (parentBind.y + pPar.py*parentBind.h)*STAGE_H;

  const scaleW = parentBind.w>1e-6 ? parentNow.w/parentBind.w : 1;
  const scaleH = parentBind.h>1e-6 ? parentNow.h/parentBind.h : 1;
  const deltaRot = parentNow.rotation - parentBind.rotation;

  const childCxPx = (local.x + pSelf.px*local.w)*STAGE_W;
  const childCyPx = (local.y + pSelf.py*local.h)*STAGE_H;

  let offX = (childCxPx - cxBind) * scaleW;
  let offY = (childCyPx - cyBind) * scaleH;

  const cos = Math.cos(deltaRot), sin = Math.sin(deltaRot);
  const rotOffX = offX*cos - offY*sin;
  const rotOffY = offX*sin + offY*cos;

  const worldCxPx = cxNow + rotOffX;
  const worldCyPx = cyNow + rotOffY;
  const worldW = local.w*scaleW;
  const worldH = local.h*scaleH;

  return {
    frame,
    x: worldCxPx/STAGE_W - pSelf.px*worldW,
    y: worldCyPx/STAGE_H - pSelf.py*worldH,
    w: worldW,
    h: worldH,
    rotation: local.rotation + deltaRot,
    opacity: local.opacity,
    flipX: local.flipX,
    flipY: local.flipY
  };
}

function getParentAdjustFactors(obj, frame){
  if(!obj.parentId) return { scaleW:1, scaleH:1, rotation:0 };
  const parentObj = findObjectById(obj.parentId);
  if(!parentObj) return { scaleW:1, scaleH:1, rotation:0 };
  const bindFrame = Number.isFinite(obj.parentBindFrame) ? obj.parentBindFrame : frame;
  const parentNow = worldTransformAt(parentObj, frame);
  const parentBind = worldTransformAt(parentObj, bindFrame);
  if(!parentNow || !parentBind) return { scaleW:1, scaleH:1, rotation:0 };
  return {
    scaleW: parentBind.w>1e-6 ? parentNow.w/parentBind.w : 1,
    scaleH: parentBind.h>1e-6 ? parentNow.h/parentBind.h : 1,
    rotation: parentNow.rotation - parentBind.rotation
  };
}

let clipboardStrokes = null;
let clipboardImageObject = null;

const uid = () => Math.random().toString(36).slice(2,10);

const emptyLayer = (name, frameCount) => ({
  id: uid(),
  name: name,
  visible: true,
  opacity: 1,

const imageCache = new Map();

function loadImage(src){
  const cached = imageCache.get(src);
  if(cached && cached.complete){
    return Promise.resolve(cached);
  }
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{ imageCache.set(src,img); resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}

// প্রজেক্ট লোড/রিস্টোরের পর প্রতিটি image object-এর src (base + shape library)
// আবার decode করে imageCache-এ rebuild করে, যাতে canvas ফাঁকা না থাকে।
async function preloadImageObjectSources(objects){
  const srcs = new Set();
  (objects || []).forEach(o => {
    if(o && typeof o.src === "string" && o.src) srcs.add(o.src);
    (o && Array.isArray(o.shapes) ? o.shapes : []).forEach(sh => {
      if(sh && typeof sh.src === "string" && sh.src) srcs.add(sh.src);
    });
  });
  // broken/অসম্পূর্ণ cache entry বাদ দাও, যাতে নতুন করে decode হয়
  srcs.forEach(src => {
    const c = imageCache.get(src);
    if(c && !c.complete) imageCache.delete(src);
  });
  await Promise.all([...srcs].map(src => loadImage(src).catch(()=>null)));
}


function pathStroke(ctx,s,sx,sy){
  const p = s.pts;
  if(!p || !p.length) return;
  const a = p[0];
  const b = p[p.length-1];

  ctx.beginPath();

  if(s.tool==="line" && p.length>1){
    ctx.moveTo(a.x*sx,a.y*sy);
    ctx.lineTo(b.x*sx,b.y*sy);
  }
  else if(s.tool==="rect" && p.length>1){
    ctx.rect(a.x*sx, a.y*sy, (b.x-a.x)*sx, (b.y-a.y)*sy);
  }
  else if(s.tool==="ellipse" && p.length>1){
    ctx.ellipse(
      ((a.x+b.x)/2)*sx,
      ((a.y+b.y)/2)*sy,
      Math.abs(b.x-a.x)*sx*.5,
      Math.abs(b.y-a.y)*sy*.5,
      0, 0, Math.PI*2
    );
  }
  else{
    ctx.moveTo(a.x*sx,a.y*sy);
    if(p.length===1){ ctx.lineTo(a.x*sx+.01, a.y*sy); }
    for(let i=1; i<p.length; i++){
      const prev = p[i-1];
      const cur = p[i];
      ctx.quadraticCurveTo(
        prev.x*sx, prev.y*sy,
        ((prev.x+cur.x)/2)*sx, ((prev.y+cur.y)/2)*sy
      );
    }
  }
  ctx.stroke();
}

function drawStrokes(ctx, strokes, w, h, alpha=1, tint){
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for(const s of strokes){
    const isEraser = s.tool==="eraser";
    ctx.globalAlpha = isEraser ? 1 : alpha*(s.opacity ?? 1);
    ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";

    if(s.tool==="image"){ continue; }

    ctx.strokeStyle = isEraser ? "#fff" : (tint ?? s.color);
    ctx.lineWidth = (s.size/1000)*w;

    pathStroke(ctx, s, w, h);
  }
  ctx.restore();
}

let scratch = null;
function scratchCtx(w,h){
  if(!scratch){ scratch = document.createElement("canvas"); }
  if(scratch.width!==w || scratch.height!==h){ scratch.width = w; scratch.height = h; }
  const ctx = scratch.getContext("2d");
  if(!ctx) return null;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.clearRect(0,0,w,h);
  return ctx;
}

let onionScratch = null;
function onionScratchCtx(w,h){
  if(!onionScratch){ onionScratch = document.createElement("canvas"); }
  if(onionScratch.width!==w || onionScratch.height!==h){ onionScratch.width = w; onionScratch.height = h; }
  const ctx = onionScratch.getContext("2d");
  if(!ctx) return null;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.clearRect(0,0,w,h);
  return ctx;
}

function drawOnionLayer(ctx, layers, imageObjects, index, w, h, alpha, tint){
  const octx = onionScratchCtx(w,h);
  if(!octx){
    for(const l of layers){
      if(!l.visible) continue;
      drawStrokes(ctx, l.frames[index] || [], w, h, alpha, tint);
      drawImageObjectsForLayer(ctx, imageObjects, l.id, alpha, index, w, h);
    }
    return;
  }
  for(const l of layers){
    if(!l.visible) continue;
    drawStrokes(octx, l.frames[index] || [], w, h, 1);
    drawImageObjectsForLayer(octx, imageObjects, l.id, 1, index, w, h);
  }

  if(tint){
    octx.save();
    octx.globalCompositeOperation = "source-atop";
    octx.globalAlpha = 1;
    octx.fillStyle = tint;
    octx.fillRect(0,0,w,h);
    octx.restore();
  }

  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = alpha;
  ctx.drawImage(octx.canvas, 0, 0);
  ctx.restore();
}

function drawImageObjectsForLayer(ctx, imageObjects, layerId, layerOpacity, frame, w, h){
  imageObjects.forEach(o=>{
    if(o.layerId!==layerId) return;
    const t = worldTransformAt(o, frame);
    if(!t) return;
    const shape = resolveActiveShape(o, frame);
    const img = imageCache.get(shape.src);
    if(!img || !img.complete) return;

    const pv = pivotOf(o);
    const cx = (t.x + pv.px*t.w)*w;
    const cy = (t.y + pv.py*t.h)*h;
    const dw = t.w*w, dh = t.h*h;
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = layerOpacity * Math.max(0, Math.min(1, t.opacity));
    ctx.translate(cx, cy);
    ctx.rotate(t.rotation);
    ctx.scale(t.flipX ? -1 : 1, t.flipY ? -1 : 1);
    const ox = (t.flipX ? -(1-pv.px) : -pv.px)*dw;
    const oy = (t.flipY ? -(1-pv.py) : -pv.py)*dh;
    ctx.drawImage(img, ox, oy, dw, dh);
    ctx.restore();
  });
}

function renderFrame(ctx, layers, imageObjects, index, w, h, bg, live){
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  const objs = imageObjects || [];

  layers.forEach((l,li)=>{
    if(!l.visible) return;
    const strokes = [...(l.frames[index] || [])];
    if(live && live.layer===li){ strokes.push(live.stroke); }

    const octx = scratchCtx(w,h);
    if(!octx){
      drawStrokes(ctx, strokes, w, h, l.opacity);
    } else {
      drawStrokes(octx, strokes, w, h, 1);
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = l.opacity;
      ctx.drawImage(octx.canvas, 0, 0);
      ctx.restore();
    }

    drawImageObjectsForLayer(ctx, objs, l.id, l.opacity, index, w, h);
  });
}

function drawSelectionBox(ctx, obj, w, h){
  const t = worldTransformAt(obj, S.frame);
  if(!t) return;

  const pv = pivotOf(obj);
  const W = t.w*w, H = t.h*h;
  const cx = (t.x + pv.px*t.w)*w;
  const cy = (t.y + pv.py*t.h)*h;
  const left = -pv.px*W, right = (1-pv.px)*W;
  const top = -pv.py*H, bottom = (1-pv.py)*H;
  const midX = left + W/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t.rotation);

  ctx.strokeStyle = "#e6a559";
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.strokeRect(left, top, W, H);
  ctx.setLineDash([]);

  const rY = top-30;
  ctx.beginPath();
  ctx.moveTo(midX, top);
  ctx.lineTo(midX, rY);
  ctx.stroke();

  ctx.fillStyle = "#e6a559";
  ctx.strokeStyle = "#2b1c0d";
  ctx.lineWidth = 1.5;

  // rotate handle
  ctx.beginPath();
  ctx.arc(midX, rY, 8, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // scale handle (bottom-right corner)
  ctx.beginPath();
  ctx.arc(right, bottom, 8, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // pivot handle (anchor point) at local origin
  ctx.beginPath();
  ctx.strokeStyle = "#f2ede0";
  ctx.lineWidth = 1.5;
  ctx.moveTo(-11, 0); ctx.lineTo(11, 0);
  ctx.moveTo(0, -11); ctx.lineTo(0, 11);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI*2);
  ctx.fillStyle = "#2b1c0d";
  ctx.fill();
  ctx.strokeStyle = "#f2ede0";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

  view: { z: 1, x: 0, y: 0 },
  bg: "#ffffff",
  audioClips: [],
  selectedAudioClipId: null,
  audioSplitFrame: null,
  currentProjectId: null,
  // কোন ভিউ খোলা আছে: 'canvas' বা 'files'
  currentView: "canvas"
};

let past = [];
let future = [];
let pointers = new Map();
let gesture = null;
let drawing = null;
let transformDrag = null;
let playInterval = null;
let autosaveTimer = 0;
const exportState = { active: false };

function frameCount(){
  return S.layers[0] ? S.layers[0].frames.length : 1;
}

function ensureFrameCount(n){
  const cur = frameCount();
  if(n <= cur) return;
  const add = n - cur;
  commit(ls => ls.map(l => ({ ...l, frames: [...l.frames, ...Array.from({length:add}, ()=>[])] })));
}

function commit(mutator){
  past.push({
    layers: JSON.parse(JSON.stringify(S.layers)),
    imageObjects: cloneImageObjects(S.imageObjects)
  });
  if(past.length>40) past.shift();
  future = [];

  if(typeof mutator==="function"){
    const result = mutator(S.layers, S.imageObjects);
    if(Array.isArray(result)){
      S.layers = result;
    } else if(result && typeof result==="object"){
      if(result.layers) S.layers = result.layers;
      if(result.imageObjects) S.imageObjects = result.imageObjects;
    }
  } else {
    S.layers = mutator;
  }

  autosave();
  renderUndoRedo();
}

function undo(){
  if(!past.length) return;
  future.push({ layers: S.layers, imageObjects: S.imageObjects });
  const prev = past.pop();
  S.layers = prev.layers;
  S.imageObjects = prev.imageObjects;
  S.selectedObjectId = null;
  autosave();
  renderAll();
}

function redo(){
  if(!future.length) return;
  past.push({ layers: S.layers, imageObjects: S.imageObjects });
  const next = future.pop();
  S.layers = next.layers;
  S.imageObjects = next.imageObjects;
  S.selectedObjectId = null;
  autosave();
  renderAll();
}

/* ---------- IndexedDB (অডিও ক্লিপ) ---------- */
const AUDIO_DB_NAME = "frameo-studio-audio";
const AUDIO_STORE = "clips";
let audioDbPromise = null;
function openAudioDb(){
  if(audioDbPromise) return audioDbPromise;
  audioDbPromise = new Promise((resolve, reject)=>{
    try{
      const req = indexedDB.open(AUDIO_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(AUDIO_STORE)) db.createObjectStore(AUDIO_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  }).catch(()=>null);
  return audioDbPromise;
}
function audioClipSignature(){
  return S.audioClips.map(c => [c.id, c.startFrame, c.trimStart, c.trimEnd, c.volume, c.fileName].join(":")).join("|");
}
let lastAudioSignature = null;
/* IndexedDB থেকে অডিও ফিরে আসার আগে কখনোই সেভ করা যাবে না —
   নইলে খালি array দিয়ে পুরনো ক্লিপ মুছে যেতে পারে */
let audioRestoreDone = false;
async function saveAudioClips(force){
  if(!audioRestoreDone) return;
  const sig = audioClipSignature();
  if(!force && sig === lastAudioSignature) return;
  lastAudioSignature = sig;
  const db = await openAudioDb();
  if(!db) return;
  try{
    const payload = S.audioClips.map(c => ({
      id: c.id,
      fileName: c.fileName,
      fileType: c.fileType || "",
      fileBytes: c.fileBytes || null,
      samples: c.samples,
      sampleRate: c.sampleRate,
      fileDuration: c.fileDuration,
      startFrame: c.startFrame,
      trimStart: c.trimStart,
      trimEnd: c.trimEnd,
      volume: c.volume
    }));
    await new Promise(resolve => {
      const tx = db.transaction(AUDIO_STORE, "readwrite");
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
      tx.onabort = () => resolve();
      tx.objectStore(AUDIO_STORE).put(payload, "clips");
    });
  }catch(e){}
}
async function restoreAudioClips(){
  const db = await openAudioDb();
  if(!db){ audioRestoreDone = true; return false; }
  const rows = await new Promise(resolve=>{
    try{
      const req = db.transaction(AUDIO_STORE, "readonly").objectStore(AUDIO_STORE).get("clips");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    }catch(e){ resolve(null); }
  });
  if(!Array.isArray(rows) || !rows.length){ audioRestoreDone = true; return false; }
  S.audioClips = rows.map(r => {
    let objectUrl = null;
    if(r.fileBytes){
      try{ objectUrl = URL.createObjectURL(new Blob([r.fileBytes], { type: r.fileType || "audio/mpeg" })); }catch(e){}
    }
    const clip = {
      ...r,
      src: objectUrl,
      objectUrl,
      samples: r.samples instanceof Float32Array ? r.samples : new Float32Array(r.samples || [])
    };
    refreshClipFrames(clip);
    return clip;
  });
  lastAudioSignature = audioClipSignature();
  audioRestoreDone = true;
  let need = 0;
  S.audioClips.forEach(c => { need = Math.max(need, clipEndFrame(c)); });
  if(need > frameCount()) ensureFrameCount(need);
  return true;
}


/* প্রজেক্ট লোড/রিস্টোরের সময় image object তালিকা সম্পূর্ণভাবে নতুন করে বানায় —
   পুরনো প্রজেক্টের leftover/dangling object কখনো টিকে থাকবে না */
function sanitizeImageObjects(rawObjects, layers, opts){
  const list = Array.isArray(rawObjects) ? rawObjects : [];
  const validIds = new Set((layers||[]).map(l => l.id));
  let out = list.map(o => {
    let layerId = o.layerId;
    if(!layerId || !validIds.has(layerId)){
      const lo = (layers||[])[o.layer];
      layerId = lo ? lo.id : null;
    }
    return {
      parentId: null, parentBindFrame: null, group: "",
      pivotX: 0.5, pivotY: 0.5,
      shapes: [], shapeKeyframes: [],
      ...o,
      layerId
    };
  }).filter(o => o.layerId && validIds.has(o.layerId));
  const seen = new Set();
  out = out.filter(o => {
    if(!o.id) o.id = uid();
    if(seen.has(o.id)) return false;
    seen.add(o.id);
    return true;
  });
  out = out.map(dedupeIdenticalKeyframes);
  if(opts && opts.mergeOverlapping) out = dedupeOverlappingImageObjects(out);
  out = clearDanglingParents(out);
  return out;
}

function autosaveSnapshot(){
  return {
    layers: S.layers,
    imageObjects: S.imageObjects,
    fps: S.fps,
    onionBefore: S.onionBefore,
    onionAfter: S.onionAfter,
    onion: S.onion,
    // session / UI অবস্থা
    frame: S.frame,
    activeLayer: S.activeLayer,
    focus: S.focus,
    tool: S.tool,
    color: S.color,
    brushSize: S.brushSize,
    brushOpacity: S.brushOpacity,
    eraserSize: S.eraserSize,
    view: S.view,
    bg: S.bg,
    loop: S.loop,
    selectedObjectId: S.selectedObjectId,
    selectedAudioClipId: S.selectedAudioClipId,
    currentProjectId: S.currentProjectId || null,
    currentView: S.currentView === "files" ? "files" : "canvas",
    savedAt: Date.now()
  };
}

function autosaveNow(){
  clearTimeout(autosaveTimer);
  try{
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(autosaveSnapshot()));
  }catch(e){}
  saveAudioClips();
  /* Saved gallery projects are independent snapshots — never auto-overwritten */
}

function autosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, 500);
}

function tryRestore(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data && Array.isArray(data.layers) && data.layers.length){
      S.layers = data.layers;
      S.imageObjects = sanitizeImageObjects(data.imageObjects, S.layers, { mergeOverlapping: true });

      S.layers = S.layers.map(l => ({
        ...l,
        frames: l.frames.map(f => f.filter(s => s.tool!=="image"))
      }));


      if(data.fps) S.fps = data.fps;
      if(typeof data.onion === "boolean") S.onion = data.onion;
      if(Number.isFinite(data.onionBefore)) S.onionBefore = data.onionBefore;
      if(Number.isFinite(data.onionAfter)) S.onionAfter = data.onionAfter;

      // session / UI অবস্থা
      if(TOOLS.some(t => t.id === data.tool) && data.tool !== "settings") S.tool = data.tool;
      if(typeof data.color === "string") S.color = data.color;
      if(Number.isFinite(data.brushSize)) S.brushSize = data.brushSize;
      if(Number.isFinite(data.brushOpacity)) S.brushOpacity = data.brushOpacity;
      if(Number.isFinite(data.eraserSize)) S.eraserSize = data.eraserSize;
      if(typeof data.bg === "string") S.bg = data.bg;
      if(typeof data.loop === "boolean") S.loop = data.loop;
      if(data.view && Number.isFinite(data.view.z)) S.view = { z: data.view.z, x: data.view.x || 0, y: data.view.y || 0 };
      if(Number.isFinite(data.activeLayer)) S.activeLayer = Math.max(0, Math.min(S.layers.length-1, data.activeLayer));
      if(Number.isFinite(data.frame)) S.frame = Math.max(0, Math.min(frameCount()-1, data.frame));
      if(data.focus === "audio" || data.focus === "layer") S.focus = data.focus;
      if(data.selectedObjectId && S.imageObjects.some(o=>o.id===data.selectedObjectId)) S.selectedObjectId = data.selectedObjectId;
      if(data.selectedAudioClipId) S.selectedAudioClipId = data.selectedAudioClipId;
      if(data.currentProjectId) S.currentProjectId = data.currentProjectId;
      if(data.currentView === "files" || data.currentView === "canvas") S.currentView = data.currentView;
      return true;
    }
  }catch(e){}
  return false;
}

const canvas = document.getElementById("canvas");
const ctx2d = canvas.getContext("2d");
const stageWrap = document.getElementById("stageWrap");

function resizeCanvas(){
  const wrapW = stageWrap.clientWidth;
  const wrapH = stageWrap.clientHeight;
  if(!wrapW || !wrapH) return;

  const dpr = 1;

  canvas.width = Math.round(STAGE_W * dpr);
  canvas.height = Math.round(STAGE_H * dpr);

  canvas.style.width = wrapW + "px";
  canvas.style.height = wrapH + "px";

  applyViewTransform();
  paint();
}

function paint(){
  const w = canvas.width;
  const h = canvas.height;
  if(!w || !h) return;

  const live = drawing ? { layer: S.activeLayer, stroke: drawing } : null;
  renderFrame(ctx2d, S.layers, S.imageObjects, S.frame, w, h, S.bg, live);

  if(S.onion && !S.playing){
    for(let k=1; k<=S.onionBefore; k++){
      const i = S.frame-k;
      if(i<0) break;
      drawOnionLayer(ctx2d, S.layers, S.imageObjects, i, w, h, .3/k, "#4aa8ff");
    }
    for(let k=1; k<=S.onionAfter; k++){
      const i = S.frame+k;
      if(i>frameCount()-1) break;
      drawOnionLayer(ctx2d, S.layers, S.imageObjects, i, w, h, .24/k, "#ff5d73");
    }
  }

  if(S.tool==="select" && !S.playing){
    const obj = S.imageObjects.find(o=>o.id===S.selectedObjectId);
    if(obj) drawSelectionBox(ctx2d, obj, w, h);
  }
}

try{
  new ResizeObserver(resizeCanvas).observe(stageWrap);
}catch(e){
  console.error("ResizeObserver সাপোর্ট নেই, window resize দিয়ে fallback করা হচ্ছে:", e);
  window.addEventListener("resize", resizeCanvas);
}

function applyViewTransform(){
  canvas.style.transformOrigin = "center center";
  canvas.style.transform = `translate(${S.view.x}px, ${S.view.y}px) scale(${S.view.z})`;
}

function startPlayback(){
  clearInterval(playInterval);
  const interval = 1000 / S.fps;

  playInterval = setInterval(() => {
    if(!S.playing) { clearInterval(playInterval); return; }

    let nextFrame = S.frame + 1;
    if(nextFrame >= frameCount()){
      if(!S.loop){
        S.playing = false;
        clearInterval(playInterval);
        renderPlayButton();
        return;
      }
      nextFrame = 0;
      startAudioPlaybackFromFrame(0);
    }

    S.frame = nextFrame;
    paint();
    updateFrameCounter();
    updateTimelineActive();
  }, interval);
}

function stopPlayback(){
  clearInterval(playInterval);
}

function posFromEvent(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
}

function pxFromEvent(e){
  const n = posFromEvent(e);
  return { x: n.x*canvas.width, y: n.y*canvas.height };
}

function getOrCreateKeyframeAtCurrentFrame(obj){
  let kf = obj.keyframes.find(k=>k.frame===S.frame);
  if(kf) return kf;

  if(obj.keyframes.length===1){
    return obj.keyframes[0];
  }

  const t = objectTransformAt(obj, S.frame);
  kf = { frame:S.frame, x:t.x, y:t.y, w:t.w, h:t.h, rotation:t.rotation, opacity:t.opacity, flipX: !!t.flipX, flipY: !!t.flipY, easing:"linear" };
  obj.keyframes.push(kf);
  return kf;
}

function objectHitTest(obj, pxPoint){
  const t = worldTransformAt(obj, S.frame);
  if(!t) return null;
  const w = canvas.width, h = canvas.height;
  const pv = pivotOf(obj);
  const W = t.w*w, H = t.h*h;
  const cx = (t.x + pv.px*t.w)*w;
  const cy = (t.y + pv.py*t.h)*h;
  const left = -pv.px*W, right = (1-pv.px)*W;
  const top = -pv.py*H, bottom = (1-pv.py)*H;
  const midX = left + W/2;

  const dx = pxPoint.x - cx;
  const dy = pxPoint.y - cy;
  const cos = Math.cos(-t.rotation);
  const sin = Math.sin(-t.rotation);
  const lx = dx*cos - dy*sin;
  const ly = dx*sin + dy*cos;

  const HR = 24;
  if(Math.hypot(lx, ly) <= 20) return "pivot";
  if(Math.hypot(lx-right, ly-bottom) <= HR) return "scale";
  const rY = top-30;
  if(Math.hypot(lx-midX, ly-rY) <= HR) return "rotate";
  if(lx>=left && lx<=right && ly>=top && ly<=bottom) return "move";
  return null;
}

/* Move the pivot without visually moving the object: every keyframe's
   top-left is compensated by (I - R) * delta, because the object is now
   rendered rotated around the new anchor. */
function applyPivotChange(obj, startKfs, oldPivot, newPivot){
  obj.pivotX = newPivot.px;
  obj.pivotY = newPivot.py;
  const dpx = newPivot.px - oldPivot.px;
  const dpy = newPivot.py - oldPivot.py;

  obj.keyframes.forEach((kf, i)=>{
    const s = startKfs[i];
    if(!s) return;
    const dX = dpx * s.w * STAGE_W;
    const dY = dpy * s.h * STAGE_H;
    const cos = Math.cos(s.rotation), sin = Math.sin(s.rotation);
    const rX = dX*cos - dY*sin;
    const rY = dX*sin + dY*cos;
    kf.x = s.x - (dX - rX)/STAGE_W;
    kf.y = s.y - (dY - rY)/STAGE_H;
  });
}

function applyDragUpdate(drag, p){
  const kf = drag.kf;
  const w = canvas.width, h = canvas.height;

  if(drag.mode==="move"){
    let dxPx = p.x - drag.startPointer.x;
    let dyPx = p.y - drag.startPointer.y;
    const pa = drag.parentAdjust;
    if(pa && (pa.rotation || pa.scaleW!==1 || pa.scaleH!==1)){
      const cos = Math.cos(-pa.rotation), sin = Math.sin(-pa.rotation);
      const ux = dxPx*cos - dyPx*sin;
      const uy = dxPx*sin + dyPx*cos;
      dxPx = pa.scaleW ? ux/pa.scaleW : ux;
      dyPx = pa.scaleH ? uy/pa.scaleH : uy;
    }
    kf.x = drag.startTransform.x + dxPx/w;
    kf.y = drag.startTransform.y + dyPx/h;
  }
  else if(drag.mode==="scale"){
    // scale around the pivot point, not the center
    const curDist = Math.hypot(p.x-drag.centerPx.x, p.y-drag.centerPx.y) || 1;
    const ratio = Math.max(0.05, curDist/drag.startDist);
    const newW = Math.max(0.02, drag.startTransform.w*ratio);
    const newH = Math.max(0.02, drag.startTransform.h*ratio);
    const pv = drag.pivot;
    const anchorX = drag.startTransform.x + pv.px*drag.startTransform.w;
    const anchorY = drag.startTransform.y + pv.py*drag.startTransform.h;
    kf.w = newW; kf.h = newH;
    kf.x = anchorX - pv.px*newW;
    kf.y = anchorY - pv.py*newH;
  }
  else if(drag.mode==="rotate"){
    // rotate around the pivot point
    const startAng = Math.atan2(drag.startPointer.y-drag.centerPx.y, drag.startPointer.x-drag.centerPx.x);
    const curAng = Math.atan2(p.y-drag.centerPx.y, p.x-drag.centerPx.x);
    kf.rotation = drag.startTransform.rotation + (curAng-startAng);
  }
  else if(drag.mode==="pivot"){
    const obj = findObjectById(drag.objId);
    if(!obj) return;
    const t = drag.startWorld;
    const W = t.w*w, H = t.h*h;
    if(W<1e-6 || H<1e-6) return;
    const dx = p.x - drag.centerPx.x;
    const dy = p.y - drag.centerPx.y;
    const cos = Math.cos(-t.rotation), sin = Math.sin(-t.rotation);
    const lx = dx*cos - dy*sin;
    const ly = dx*sin + dy*cos;
    const np = {
      px: Math.max(0, Math.min(1, drag.pivot.px + lx/W)),
      py: Math.max(0, Math.min(1, drag.pivot.py + ly/H))
    };
    applyPivotChange(obj, drag.startKfs, drag.pivot, np);
  }
}

canvas.addEventListener("pointerdown", e=>{
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pointers.size >= 2){
    drawing = null;
    transformDrag = null;
    const vals = [...pointers.values()];
    const a = vals[0], b = vals[1];
    if(a && b){
      gesture = { dist: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x)/2, cy: (a.y + b.y)/2 };
    }
    paint();
    return;
  }

  if(S.playing) return;

  if(S.tool === "select"){
    const p = pxFromEvent(e);
    const activeLayerId = S.layers[S.activeLayer] ? S.layers[S.activeLayer].id : null;
    let hitObj = null, hitMode = null;

    const selected = S.imageObjects.find(o=>o.id===S.selectedObjectId && o.layerId===activeLayerId);
    if(selected){
      const mode = objectHitTest(selected, p);
      if(mode){ hitObj = selected; hitMode = mode; }
    }

    if(!hitObj){
      for(let i=S.imageObjects.length-1; i>=0; i--){
        const obj = S.imageObjects[i];
        if(obj.layerId !== activeLayerId) continue;
        const layerObj = S.layers[S.activeLayer];
        if(!layerObj || !layerObj.visible) continue;
        if(objectHitTest(obj, p)==="move"){ hitObj = obj; hitMode = "move"; break; }
      }
    }

    if(hitObj){
      const preState = { layers: S.layers, imageObjects: cloneImageObjects(S.imageObjects) };

      focusLayer();
      S.selectedObjectId = hitObj.id;

      const kf = hitMode==="pivot" ? (hitObj.keyframes[0]||null) : getOrCreateKeyframeAtCurrentFrame(hitObj);
      const w = canvas.width, h = canvas.height;
      const worldNow = worldTransformAt(hitObj, S.frame) || kf;
      const pv = pivotOf(hitObj);
      // all rotation / scale / pivot drags orbit the pivot point
      const centerPx = { x:(worldNow.x + pv.px*worldNow.w)*w, y:(worldNow.y + pv.py*worldNow.h)*h };
      const startDist = Math.hypot(p.x-centerPx.x, p.y-centerPx.y) || 1;
      const parentAdjust = getParentAdjustFactors(hitObj, S.frame);

      transformDrag = {
        objId: hitObj.id, mode: hitMode, kf,
        startPointer: p,
        startTransform: kf ? { x:kf.x, y:kf.y, w:kf.w, h:kf.h, rotation:kf.rotation } : null,
        pivot: pv,
        startWorld: worldNow,
        startKfs: hitObj.keyframes.map(k=>({ ...k })),
        centerPx, startDist, preState, parentAdjust
      };
      canvas.setPointerCapture(e.pointerId);
    } else {
      focusLayer();
      S.selectedObjectId = null;
    }
    renderAll();
    return;
  }

  canvas.setPointerCapture(e.pointerId);

  let currentSize = S.brushSize;
  let currentOpacity = S.brushOpacity;
  if(S.tool === "eraser"){
    currentSize = S.eraserSize;
    currentOpacity = 1;
  }

  drawing = {
    id: uid(), tool: S.tool, color: S.color, size: currentSize, opacity: currentOpacity,
    pts: [posFromEvent(e)]
  };

  paint();
}, { passive: false });

canvas.addEventListener("pointermove", e=>{
  e.preventDefault();
  if(pointers.has(e.pointerId)){ pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); }

  if(pointers.size >= 2){
    const vals = [...pointers.values()];
    const a = vals[0], b = vals[1];
    if(!a || !b || !gesture) return;

    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const cx = (a.x + b.x)/2;
    const cy = (a.y + b.y)/2;
    const v = S.view;
    const z = Math.min(10, Math.max(1, v.z * (dist/(gesture.dist || dist))));

    S.view.z = z;
    S.view.x += (cx - gesture.cx);
    S.view.y += (cy - gesture.cy);

    gesture = { dist, cx, cy };
    applyViewTransform();
    return;
  }

  if(transformDrag){
    applyDragUpdate(transformDrag, pxFromEvent(e));
    paint();
    return;
  }

  if(!drawing) return;
  drawing.pts.push(posFromEvent(e));
  paint();
}, { passive: false });

function onPointerUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) gesture = null;

  if(transformDrag){
    past.push(transformDrag.preState);
    if(past.length>40) past.shift();
    future = [];
    transformDrag = null;
    autosave();
    renderUndoRedo();
    renderObjectPanel();
    paint();
    return;
  }

  const d = drawing;
  drawing = null;

  } : l));

  renderTimeline();
  paint();
}

async function detectAlphaContentBox(img){
  const DET_MAX = 256;
  const scale = Math.min(1, DET_MAX/Math.max(img.naturalWidth, img.naturalHeight));
  const dw = Math.max(1, Math.round(img.naturalWidth*scale));
  const dh = Math.max(1, Math.round(img.naturalHeight*scale));

  const c = document.createElement("canvas");
  c.width = dw; c.height = dh;
  const cctx = c.getContext("2d");
  cctx.drawImage(img, 0, 0, dw, dh);

  let data;
  try{ data = cctx.getImageData(0, 0, dw, dh).data; }catch(e){ return null; }

  const TH = 10;
  let minX=dw, minY=dh, maxX=-1, maxY=-1;
  for(let y=0; y<dh; y++){
    for(let x=0; x<dw; x++){
      const a = data[(y*dw+x)*4+3];
      if(a>TH){
        if(x<minX) minX=x;
        if(x>maxX) maxX=x;
        if(y<minY) minY=y;
        if(y>maxY) maxY=y;
      }
    }
  }
  if(maxX<minX || maxY<minY) return null;

  return { x0: minX/dw, y0: minY/dh, x1: (maxX+1)/dw, y1: (maxY+1)/dh };
}

async function processImportedImage(file){
  const rawSrc = await new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result));
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });

  const rawImg = await loadImage(rawSrc);

  const MAX_DIM = STAGE_W * 2;
  let targetW = rawImg.naturalWidth;
  let targetH = rawImg.naturalHeight;
  if(Math.max(targetW, targetH) > MAX_DIM){
    const scale = MAX_DIM / Math.max(targetW, targetH);
    targetW = Math.max(1, Math.round(targetW*scale));
    targetH = Math.max(1, Math.round(targetH*scale));
  }

  let src = rawSrc;
  if(targetW !== rawImg.naturalWidth || targetH !== rawImg.naturalHeight){
    const off = document.createElement("canvas");
    off.width = targetW;
    off.height = targetH;
    const octx = off.getContext("2d");
    octx.drawImage(rawImg, 0, 0, targetW, targetH);
    const usePng = file.type === "image/png";
    src = usePng ? off.toDataURL("image/png") : off.toDataURL("image/jpeg", 0.9);
  }

  let img = await loadImage(src);

  if(file.type === "image/png"){
    try{
      const box = await detectAlphaContentBox(img);
      if(box){
        const padL = box.x0, padT = box.y0, padR = 1-box.x1, padB = 1-box.y1;
        const hasMeaningfulPadding = (padL+padR) > 0.02 || (padT+padB) > 0.02;
        if(hasMeaningfulPadding){
          const cropX = Math.round(box.x0*img.naturalWidth);
          const cropY = Math.round(box.y0*img.naturalHeight);
          const cropW = Math.max(1, Math.round((box.x1-box.x0)*img.naturalWidth));
          const cropH = Math.max(1, Math.round((box.y1-box.y0)*img.naturalHeight));

          const cropCanvas = document.createElement("canvas");
          cropCanvas.width = cropW;
          cropCanvas.height = cropH;
          const cropCtx = cropCanvas.getContext("2d");
          cropCtx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

          const trimmedSrc = cropCanvas.toDataURL("image/png");
          const trimmedImg = await loadImage(trimmedSrc);
          src = trimmedSrc;
          img = trimmedImg;
        }
      }
    }catch(e){
      console.error("Transparent padding trim ব্যর্থ হয়েছে, আসল ছবি দিয়েই এগোনো হচ্ছে:", e);
    }
  }

  return { src, natW: img.naturalWidth, natH: img.naturalHeight };
}

/* ================= AUDIO ENGINE (CapCut-style multi-clip) ================= */

let audioCtx = null;
let activeAudioSources = [];

function ensureAudioCtx(){
  if(!audioCtx){
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return null;
    audioCtx = new AudioCtx();
  }
  if(audioCtx.state === "suspended"){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}

function clipDurationSec(clip){
  return Math.max(0, (clip.trimEnd - clip.trimStart));
}
function clipDurationFrames(clip){
  return Math.max(1, Math.round(clipDurationSec(clip)*S.fps));
}
function clipEndFrame(clip){
  return clip.startFrame + clipDurationFrames(clip);
}
function refreshClipFrames(clip){
  clip.durationFrames = clipDurationFrames(clip);
  return clip;
}
function selectedAudioClip(){
  return S.audioClips.find(c => c.id === S.selectedAudioClipId) || null;
}
function focusAudio(){
  S.focus = 'audio';
  S.selectedObjectId = null;
}
function focusLayer(){
  S.focus = 'layer';
  S.selectedAudioClipId = null;
  S.audioSplitFrame = null;
}

function makeAudioBuffer(clip){
  const ctx = ensureAudioCtx();
  if(!ctx) return null;
  if(clip._buffer && clip._buffer.sampleRate === clip.sampleRate) return clip._buffer;
  const buf = ctx.createBuffer(1, clip.samples.length, clip.sampleRate);
  buf.copyToChannel(clip.samples, 0);
  clip._buffer = buf;
  return buf;
}

/* ---- audio scrubbing (short preview while dragging the playhead) ---- */
let scrubSource = null, scrubGain = null, scrubLastFrame = -1;

function stopScrubSource(){
  if(scrubSource){
    try{ scrubSource.stop(); }catch(e){}
    try{ scrubSource.disconnect(); }catch(e){}
    scrubSource = null;
  }
  if(scrubGain){ try{ scrubGain.disconnect(); }catch(e){} scrubGain = null; }
}

function scrubAudioAtFrame(frame, force){
  if(!force && frame === scrubLastFrame) return;
  scrubLastFrame = frame;
  if(!S.audioClips || !S.audioClips.length) return;
  const clip = S.audioClips.find(c => frame >= c.startFrame && frame < clipEndFrame(c));
  if(!clip || !clip.samples || !clip.samples.length) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const buf = makeAudioBuffer(clip);
  if(!buf) return;
  const offset = clip.trimStart + (frame - clip.startFrame)/S.fps;
  if(offset < 0 || offset >= clip.trimEnd) return;
  const dur = Math.min(0.08, clip.trimEnd - offset);
  if(dur <= 0.005) return;

  stopScrubSource();
  const now = ctx.currentTime;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(1, now + 0.008);
  g.gain.setValueAtTime(1, now + Math.max(0.009, dur - 0.012));
  g.gain.linearRampToValueAtTime(0, now + dur);
  g.connect(ctx.destination);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(g);
  src.start(now, offset, dur);
  src.onended = () => { if(scrubSource === src){ scrubSource = null; } try{ g.disconnect(); }catch(e){} };
  scrubSource = src;
  scrubGain = g;
}

function endAudioScrub(){
  stopScrubSource();
  scrubLastFrame = -1;
}


async function importAudioFile(file){
  if(!file) return;

  const ctx = ensureAudioCtx();
  if(!ctx){ alert("এই ব্রাউজারে অডিও প্রসেসিং সাপোর্ট করে না।"); return; }

  const arrayBuf = await file.arrayBuffer();
  const fileBytes = arrayBuf.slice(0); // decodeAudioData মূল buffer detach করে দেয়
  let decoded;
  try{
    decoded = await ctx.decodeAudioData(arrayBuf);
  }catch(e){
    alert("অডিও ফাইলটি পড়া যায়নি: " + (e && e.message ? e.message : String(e)));
    return;
  }

  const chCount = decoded.numberOfChannels;
  const len = decoded.length;
  const mono = new Float32Array(len);
  for(let c=0; c<chCount; c++){
    const chData = decoded.getChannelData(c);
    for(let i=0; i<len; i++) mono[i] += chData[i]/chCount;
  }

  const objectUrl = URL.createObjectURL(file);

  // নতুন ক্লিপ শেষ ক্লিপের পরে বসাও (ওভারল্যাপ এড়াতে)
  let startFrame = 0;
  S.audioClips.forEach(c => { startFrame = Math.max(startFrame, clipEndFrame(c)); });

  const clip = {
    id: uid(),
    src: objectUrl,
    objectUrl,
    fileName: file.name,
    fileType: file.type || "",
    fileBytes,
    samples: mono,
    sampleRate: decoded.sampleRate,
    fileDuration: decoded.duration,
    startFrame,
    trimStart: 0,
    trimEnd: decoded.duration,
    volume: 1
  };
  refreshClipFrames(clip);

  S.audioClips = [...S.audioClips, clip];
  S.selectedAudioClipId = clip.id;
  S.audioSplitFrame = null;
  focusAudio();

  const need = startFrame + clip.durationFrames;
  if(need > frameCount()) ensureFrameCount(need);

  renderAll();
  saveAudioClips(true);
}


function removeAudioClip(clipId){
  const clip = S.audioClips.find(c=>c.id===clipId);
  if(!clip) return;
  const stillUsed = S.audioClips.some(c => c.id!==clipId && c.objectUrl===clip.objectUrl);
  if(clip.objectUrl && !stillUsed){ try{ URL.revokeObjectURL(clip.objectUrl); }catch(e){} }
  S.audioClips = S.audioClips.filter(c=>c.id!==clipId);
  if(S.selectedAudioClipId===clipId){ S.selectedAudioClipId = null; S.audioSplitFrame = null; if(!S.audioClips.length) S.focus = 'layer'; }
  stopAudioPlayback();
  renderAll();
  saveAudioClips(true);

}

function splitAudioClipAtFrame(clipId, frame){
  const idx = S.audioClips.findIndex(c=>c.id===clipId);
  if(idx<0) return;
  const clip = S.audioClips[idx];
  const rel = frame - clip.startFrame;
  if(rel<=0 || rel>=clipDurationFrames(clip)) return;

  const cutSec = clip.trimStart + rel/S.fps;
  const left = { ...clip, id: uid(), trimEnd: cutSec, _buffer: clip._buffer };
  const right = { ...clip, id: uid(), trimStart: cutSec, startFrame: frame, _buffer: clip._buffer };
  refreshClipFrames(left);
  refreshClipFrames(right);

  S.audioClips = [...S.audioClips.slice(0,idx), left, right, ...S.audioClips.slice(idx+1)];
  S.selectedAudioClipId = right.id;
  S.audioSplitFrame = null;
  focusAudio();
  stopAudioPlayback();
  renderAll();
  saveAudioClips(true);

}

/* ---- Playback: প্রতিটা ক্লিপ নিজের startFrame + trim অনুযায়ী শিডিউল হয় ---- */
function stopAudioPlayback(){
  activeAudioSources.forEach(src => { try{ src.stop(); }catch(e){} });
  activeAudioSources = [];
}

function startAudioPlaybackFromFrame(frame){
  stopAudioPlayback();
  if(!S.audioClips.length) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;

  const playSec = frame / S.fps;
  const now = ctx.currentTime + 0.05;

  S.audioClips.forEach(clip => {
    const buffer = makeAudioBuffer(clip);
    if(!buffer) return;
    const clipStartSec = clip.startFrame / S.fps;
    const dur = clipDurationSec(clip);
    const clipEndSec = clipStartSec + dur;
    if(clipEndSec <= playSec) return;

    const into = Math.max(0, playSec - clipStartSec);
    const when = now + Math.max(0, clipStartSec - playSec);
    const offset = clip.trimStart + into;
    const playDur = dur - into;
    if(playDur <= 0) return;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.value = Number.isFinite(clip.volume) ? clip.volume : 1;
    src.connect(gain).connect(ctx.destination);
    try{ src.start(when, offset, playDur); }catch(e){ return; }
    src.onended = () => { activeAudioSources = activeAudioSources.filter(s=>s!==src); };
    activeAudioSources.push(src);
  });
}

/* ---- Export helper: সব ক্লিপ একটা mono buffer-এ মিক্স করা ---- */
function mixdownAudio(totalFrames){
  if(!S.audioClips.length) return null;
  const sampleRate = S.audioClips[0].sampleRate || 48000;
  const totalSec = totalFrames / S.fps;
  const outLen = Math.max(1, Math.ceil(totalSec*sampleRate));
  const out = new Float32Array(outLen);

  S.audioClips.forEach(clip => {
    const sr = clip.sampleRate || sampleRate;
    const ratio = sr / sampleRate;
    const startIdx = Math.round((clip.startFrame/S.fps)*sampleRate);
    const dur = clipDurationSec(clip);
    const count = Math.round(dur*sampleRate);
    const vol = Number.isFinite(clip.volume) ? clip.volume : 1;
    for(let i=0; i<count; i++){
      const oi = startIdx + i;
      if(oi<0) continue;
      if(oi>=outLen) break;
      const srcPos = (clip.trimStart*sr) + i*ratio;
      const i0 = Math.floor(srcPos);
      if(i0<0 || i0>=clip.samples.length) continue;
      const i1 = Math.min(clip.samples.length-1, i0+1);
      const frac = srcPos - i0;
      const v = clip.samples[i0]*(1-frac) + clip.samples[i1]*frac;
      out[oi] += v*vol;
    }
  });

  for(let i=0;i<outLen;i++){
    if(out[i]>1) out[i]=1; else if(out[i]<-1) out[i]=-1;
  }
  return { samples: out, sampleRate };
}

function mp4FileName(scale){
  return scale===1 ? "youtube-animation-1080p.mp4" : "youtube-animation-4k.mp4";
}

async function pickAvcCodec(w, h, fps, bitrate){
  const candidates = ["avc1.640034","avc1.640033","avc1.64002A","avc1.4D0033","avc1.42E03E"];
  for(const codec of candidates){
    try{
      const support = await VideoEncoder.isConfigSupported({
        codec, width:w, height:h, framerate:fps, bitrate,
        avc:{ format:"avc" }
      });
      if(support && support.supported) return codec;
    }catch(e){}
  }
  return null;
}

// True MP4 (H.264 + AAC) export via WebCodecs + mp4-muxer, frame by frame.
async function exportVideoMp4WebCodecs(scale){
  if(typeof VideoEncoder === "undefined") return false;

  const w = STAGE_W*scale;
  const h = STAGE_H*scale;
  const fps = S.fps;
  const bitrate = scale===1 ? 12000000 : 40000000;

  const codec = await pickAvcCodec(w, h, fps, bitrate);
  if(!codec) return false;

  let Muxer, ArrayBufferTarget;
  try{
    const mod = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm");
    Muxer = mod.Muxer;
    ArrayBufferTarget = mod.ArrayBufferTarget;
  }catch(e){ return false; }
  if(!Muxer) return false;

  const off = document.createElement("canvas");
  off.width = w;
  off.height = h;
  const ctx = off.getContext("2d");
  if(!ctx) return false;

  const mixed = mixdownAudio(frameCount());
  const samples = mixed ? mixed.samples : null;
  const sampleRate = mixed ? mixed.sampleRate : 48000;

  let audioOk = false;
  if(samples && typeof AudioEncoder !== "undefined"){
    try{
      const support = await AudioEncoder.isConfigSupported({
        codec:"mp4a.40.2", sampleRate, numberOfChannels:1, bitrate:128000
      });
      audioOk = !!(support && support.supported);
    }catch(e){ audioOk = false; }
  }

  const target = new ArrayBufferTarget();
  const muxer = new Muxer({
    target,
    fastStart: "in-memory",
    video: { codec:"avc", width:w, height:h, frameRate:fps },
    ...(audioOk ? { audio:{ codec:"aac", numberOfChannels:1, sampleRate } } : {})
  });

  const videoEncoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => console.error(e)
  });
  videoEncoder.configure({ codec, width:w, height:h, framerate:fps, bitrate, avc:{ format:"avc" } });

  let audioEncoder = null;
  if(audioOk){
    audioEncoder = new AudioEncoder({
      output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
      error: (e) => console.error(e)
    });
    audioEncoder.configure({ codec:"mp4a.40.2", sampleRate, numberOfChannels:1, bitrate:128000 });
  }

  exportState.active = true;
  showExportOverlay(audioOk ? "MP4 রেন্ডার হচ্ছে (অডিও সহ)…" : "MP4 রেন্ডার হচ্ছে…");

  S.playing = false;
  stopPlayback();
  renderPlayButton();
  stopAudioPlayback();

  try{
    const total = frameCount();
    for(let i=0; i<total; i++){
      renderFrame(ctx, S.layers, S.imageObjects, i, w, h, S.bg);
      const frame = new VideoFrame(off, {
        timestamp: Math.round(i*1e6/fps),
        duration: Math.round(1e6/fps)
      });
      videoEncoder.encode(frame, { keyFrame: i % fps === 0 });
      frame.close();
      showExportOverlay(`MP4 রেন্ডার হচ্ছে ${i+1}/${total}`);
      if(videoEncoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
      else if(i % 3 === 0) await new Promise(r => setTimeout(r, 0));
    }

    if(audioEncoder){
      const videoDurSec = total/fps;
      const maxSamples = Math.min(samples.length, Math.ceil(videoDurSec*sampleRate));
      const CHUNK = 1024;
      for(let off2=0; off2<maxSamples; off2+=CHUNK){
        const len = Math.min(CHUNK, maxSamples-off2);
        const data = new Float32Array(len);
        data.set(samples.subarray(off2, off2+len));
        const audioData = new AudioData({
          format:"f32-planar",
          sampleRate,
          numberOfFrames:len,
          numberOfChannels:1,
          timestamp: Math.round(off2*1e6/sampleRate),
          data
        });
        audioEncoder.encode(audioData);
        audioData.close();
        if(audioEncoder.encodeQueueSize > 16) await new Promise(r => setTimeout(r, 0));
      }
    }

    showExportOverlay("MP4 ফাইল তৈরি হচ্ছে…");
    await videoEncoder.flush();
    if(audioEncoder) await audioEncoder.flush();
    muxer.finalize();

    downloadBlob(new Blob([target.buffer], { type:"video/mp4" }), mp4FileName(scale));
    return true;
  }catch(err){
    console.error(err);
    return false;
  }finally{
    try{ videoEncoder.close(); }catch(e){}
    if(audioEncoder){ try{ audioEncoder.close(); }catch(e){} }
    exportState.active = false;
    hideExportOverlay();
  }
}

// Fallback: realtime MP4 capture through MediaRecorder when WebCodecs is unavailable.
async function exportVideoRecorder(scale){
  const w = STAGE_W*scale;
  const h = STAGE_H*scale;
  const off = document.createElement("canvas");
  off.width = w;
  off.height = h;
  const ctx = off.getContext("2d");
  if(!ctx) return;

  if(!off.captureStream || !window.MediaRecorder){ alert("এই ব্রাউজারে ভিডিও এক্সপোর্ট সাপোর্ট করে না।"); return; }

  const videoStream = off.captureStream(S.fps);

  let exportAudioCtx = null;
  let exportAudioSource = null;
  let combinedStream = videoStream;

  const mixedRec = mixdownAudio(frameCount());
  if(mixedRec && mixedRec.samples.length){
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(AudioCtx){
      exportAudioCtx = new AudioCtx();
      const buffer = exportAudioCtx.createBuffer(1, mixedRec.samples.length, mixedRec.sampleRate);
      buffer.copyToChannel(mixedRec.samples, 0);

      exportAudioSource = exportAudioCtx.createBufferSource();
      exportAudioSource.buffer = buffer;

      const destNode = exportAudioCtx.createMediaStreamDestination();
      exportAudioSource.connect(destNode);

      combinedStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...destNode.stream.getAudioTracks()
      ]);
    }
  }

  const hasAudioTrack = combinedStream.getAudioTracks().length>0;
  const mimeCandidates = hasAudioTrack ? [
    "video/mp4;codecs=avc1.640033,mp4a.40.2",
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4"
  ] : [
    "video/mp4;codecs=avc1.640033",
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4"
  ];
  const mime = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m));

  if(!mime){ alert("এই ব্রাউজারে MP4 এক্সপোর্ট সাপোর্ট করে না। Chrome বা Edge ব্যবহার করুন।"); return; }

  const rec = new MediaRecorder(combinedStream, {
    mimeType: mime, videoBitsPerSecond: scale===1 ? 20000000 : 8000000
  });

  const chunks = [];
  rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  const done = new Promise(res => rec.onstop = () => res());

  rec.start();
  exportState.active = true;
  showExportOverlay("MP4 রেন্ডার হচ্ছে…");

  S.playing = false;
  stopPlayback();
  renderPlayButton();
  stopAudioPlayback();

  if(exportAudioSource){
    try{ exportAudioSource.start(0); }catch(e){}
  }

  for(let i=0; i<frameCount(); i++){
    renderFrame(ctx, S.layers, S.imageObjects, i, w, h, S.bg);
    showExportOverlay(`MP4 রেন্ডার হচ্ছে ${i+1}/${frameCount()}`);
    await new Promise(r => setTimeout(r, Math.max(1000/S.fps, 40)));
  }

  await new Promise(r => setTimeout(r, 200));
  rec.stop();
  await done;

  if(exportAudioSource){
    try{ exportAudioSource.stop(); }catch(e){}
  }
  if(exportAudioCtx){
    try{ exportAudioCtx.close(); }catch(e){}
  }

  const blob = new Blob(chunks, { type: mime });
  downloadBlob(blob, mp4FileName(scale));

  exportState.active = false;
  hideExportOverlay();
}

// Universal fallback: pure-WASM H.264 MP4 encoder (video only, works in any browser).
function loadScriptOnce(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[data-src="${src}"]`)) return res();
    const s = document.createElement("script");
    s.src = src; s.dataset.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error("load failed"));
    document.head.appendChild(s);
  });
}

async function exportVideoMp4Wasm(scale){
  try{
    await loadScriptOnce("https://cdn.jsdelivr.net/npm/h264-mp4-encoder@1.0.12/embuild/dist/h264-mp4-encoder.web.js");
  }catch(e){ return false; }
  const HME = window.HME;
  if(!HME || !HME.createH264MP4Encoder) return false;

  const w = STAGE_W*scale, h = STAGE_H*scale;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const ctx = off.getContext("2d");
  if(!ctx) return false;

  exportState.active = true;
  showExportOverlay("MP4 রেন্ডার হচ্ছে…");
  try{
    const enc = await HME.createH264MP4Encoder();
    enc.width = w - (w % 2);
    enc.height = h - (h % 2);
    enc.frameRate = S.fps;
    enc.kbps = scale === 1 ? 12000 : 40000;
    enc.quantizationParameter = 20;
    enc.initialize();

    const total = frameCount();
    for(let i=0;i<total;i++){
      renderFrame(ctx, S.layers, S.imageObjects, i, w, h, S.bg);
      const data = ctx.getImageData(0, 0, enc.width, enc.height).data;
      enc.addFrameRgba(data);
      showExportOverlay(`MP4 রেন্ডার হচ্ছে ${i+1}/${total}`);
      await new Promise(r => setTimeout(r, 0));
    }
    showExportOverlay("MP4 ফাইল তৈরি হচ্ছে…");
    enc.finalize();
    const out = enc.FS.readFile(enc.outputFilename);
    enc.delete();
    downloadBlob(new Blob([out], { type:"video/mp4" }), mp4FileName(scale));
    return true;
  }catch(e){
    return false;
  }finally{
    exportState.active = false;
    hideExportOverlay();
  }
}

async function exportVideo(scale){
  if(exportState.active) return;
  if(await exportVideoMp4WebCodecs(scale)) return;
  if(exportState.active) exportState.active = false;
  if(await exportVideoMp4Wasm(scale)) return;
  if(exportState.active) exportState.active = false;
  await exportVideoRecorder(scale);
}
