function makeRangeScrollSafe(rangeEl){
  let startX = 0, startY = 0, startValue = 0, state = "idle"; // idle | undecided | horizontal | vertical
  function reset(){
    state = "idle";
    rangeEl.style.pointerEvents = "";
  }
  rangeEl.addEventListener("touchstart", (e) => {
    if(e.touches.length !== 1){ reset(); return; }
    state = "undecided";
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startValue = Number(rangeEl.value);
  }, { passive: true });
  rangeEl.addEventListener("touchmove", (e) => {
    if(state === "idle" || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(state === "undecided"){
      if(Math.abs(dy) > 5 && Math.abs(dy) >= Math.abs(dx)){
        state = "vertical";
        // hand the gesture back to the scroll container
        rangeEl.style.pointerEvents = "none";
      } else if(Math.abs(dx) > 5){
        state = "horizontal";
      }
    }
    if(state !== "horizontal" && Number(rangeEl.value) !== startValue){
      rangeEl.value = String(startValue);
      rangeEl.dispatchEvent(new Event("input", { bubbles:true }));
    }
  }, { passive: true });
  rangeEl.addEventListener("touchend", () => {
    if(state !== "horizontal" && Number(rangeEl.value) !== startValue){
      rangeEl.value = String(startValue);
      rangeEl.dispatchEvent(new Event("input", { bubbles:true }));
    }
    reset();
  });
  rangeEl.addEventListener("touchcancel", reset);
  document.addEventListener("touchend", () => { if(state !== "idle") reset(); }, { passive: true });
  document.addEventListener("touchcancel", () => { if(state !== "idle") reset(); }, { passive: true });
}

function attachStepper(rangeEl){
  const min = rangeEl.min !== "" ? Number(rangeEl.min) : -Infinity;
  const max = rangeEl.max !== "" ? Number(rangeEl.max) : Infinity;
  const step = 1;

  const row = el("div", "stepper-row");

  const minusBtn = el("button", "chip stepper-btn", "−");
  minusBtn.type = "button";

  const numInput = document.createElement("input");
  numInput.type = "number";
  numInput.className = "stepper-input";
  numInput.step = step;
  if(rangeEl.min !== "") numInput.min = rangeEl.min;
  if(rangeEl.max !== "") numInput.max = rangeEl.max;
  numInput.value = rangeEl.value;

  const plusBtn = el("button", "chip stepper-btn", "+");
  plusBtn.type = "button";

  function clamp(v){
    if(Number.isNaN(v)) v = Number(rangeEl.value) || 0;
    return Math.min(max, Math.max(min, v));
  }

  function pushToRange(v){
    rangeEl.value = String(clamp(v));
    numInput.value = rangeEl.value;
    rangeEl.dispatchEvent(new Event("input", { bubbles:true }));
  }

  minusBtn.onclick = () => pushToRange(Number(rangeEl.value) - step);
  plusBtn.onclick = () => pushToRange(Number(rangeEl.value) + step);

  numInput.onchange = () => pushToRange(Number(numInput.value));
  numInput.addEventListener("keydown", e => {
    if(e.key==="Enter"){ e.preventDefault(); numInput.blur(); }
  });

  rangeEl.addEventListener("input", () => { numInput.value = rangeEl.value; });

  row.appendChild(minusBtn);
  row.appendChild(numInput);
  row.appendChild(plusBtn);
  makeRangeScrollSafe(rangeEl);
  return row;
}

    for(let f=0; f<fc; f++){

        }
        renderAll();
      };
      cellsWrap.appendChild(cell);
    }

    layerImageObjects.forEach(o => {
      const kfs = sortedKeyframes(o);
      if(kfs.length<2) return;

      const lastF = kfs[kfs.length-1].frame;

      cellsWrap.appendChild(line);
    });
    row.appendChild(cellsWrap);
    table.appendChild(row);
  }
}

const CELL_W = 36;
const AUDIO_LANE_H = 64;

function drawClipWaveform(canvas, clip, widthPx){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const h = AUDIO_LANE_H - 10;
  const w = Math.max(1, Math.round(widthPx));
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
  const cx = canvas.getContext("2d");
  if(!cx) return;
  cx.scale(dpr, dpr);
  cx.clearRect(0,0,w,h);

  const sr = clip.sampleRate || 48000;
  const startIdx = Math.max(0, Math.floor(clip.trimStart*sr));
  const endIdx = Math.min(clip.samples.length, Math.ceil(clip.trimEnd*sr));
  const span = endIdx - startIdx;
  if(span <= 0) return;

  const mid = h/2;
  cx.strokeStyle = "rgba(255,225,200,.35)";
  cx.beginPath(); cx.moveTo(0, mid); cx.lineTo(w, mid); cx.stroke();

  cx.fillStyle = "#ffb066";
  const perCol = span / w;
  for(let x=0; x<w; x++){
    const a = startIdx + Math.floor(x*perCol);
    const b = Math.min(endIdx, startIdx + Math.floor((x+1)*perCol));
    let peak = 0;
    const step = Math.max(1, Math.floor((b-a)/48));
    for(let i=a; i<b; i+=step){
      const v = Math.abs(clip.samples[i]);
      if(v>peak) peak = v;
    }
    const hh = Math.max(1, peak*(h/2 - 2));
    cx.fillRect(x, mid-hh, 1, hh*2);
  }
}

function clampClipStart(clip, wanted){
  let minF = 0;
  let maxF = Infinity;
  const dur = clipDurationFrames(clip);
  S.audioClips.forEach(o => {
    if(o.id===clip.id) return;
    const oStart = o.startFrame, oEnd = clipEndFrame(o);
    if(oEnd <= clip.startFrame) minF = Math.max(minF, oEnd);
    else if(oStart >= clipEndFrame(clip)) maxF = Math.min(maxF, oStart - dur);
  });
  return Math.max(minF, Math.min(maxF, Math.max(0, wanted)));
}

function buildAudioTrackRow(fc){
  const audioRow = el("div", "audio-track-row");

  const head = el("div", "audio-track-rowhead");
  head.appendChild(el("span", null, "🔊"));
  const sel = selectedAudioClip();
  head.appendChild(el("span", "lname", sel ? sel.fileName : (S.audioClips.length ? `${S.audioClips.length} clip` : "কোনো অডিও নেই")));

  const addBtn = el("button", "visbtn", "+");
  addBtn.title = "অডিও যোগ করো";
  addBtn.onclick = e => { e.stopPropagation(); document.getElementById("audioInput").click(); };
  head.appendChild(addBtn);


  const delBtn = el("button", "visbtn", "✕");
  delBtn.title = "সিলেক্টেড ক্লিপ মুছো";
  delBtn.disabled = !sel;
  delBtn.style.opacity = sel ? "1" : ".4";
  delBtn.onclick = e => {
    e.stopPropagation();
    if(S.selectedAudioClipId) removeAudioClip(S.selectedAudioClipId);
  };
  head.appendChild(delBtn);

  audioRow.appendChild(head);

  const lane = el("div", "audio-track-lane");
  lane.style.width = (fc*CELL_W) + "px";
  lane.onpointerdown = e => {
    if(e.target === lane){
      e.stopPropagation();
      S.focus = 'audio';
      S.selectedAudioClipId = null;
      S.audioSplitFrame = null;
      renderTimeline();
    }
  };



  S.audioClips.forEach(clip => {
    refreshClipFrames(clip);
    const durF = clipDurationFrames(clip);
    const widthPx = durF*CELL_W;
    const isSel = clip.id === S.selectedAudioClipId;
    const box = el("div", `audio-clip${isSel ? " selected" : ""}`);
    box.style.left = (clip.startFrame*CELL_W) + "px";
    box.style.width = widthPx + "px";
    box.dataset.clip = clip.id;

    const cv = document.createElement("canvas");
    box.appendChild(cv);
    drawClipWaveform(cv, clip, widthPx);

    box.appendChild(el("div", "clip-name", clip.fileName));

    const beginDrag = (e) => {
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
      e.preventDefault();
      if(S.selectedAudioClipId !== clip.id){
        focusAudio();
        S.selectedAudioClipId = clip.id;
        S.audioSplitFrame = null;
        // remove selected style from any other clip so only one is highlighted
        lane.querySelectorAll('.audio-clip.selected').forEach(el => el.classList.remove('selected'));
        box.classList.add("selected");
        updateTimelineActive();
      } else {
        focusAudio();
      }
      stopAudioPlayback();
      // tap position on the waveform -> snap playhead to nearest frame
      const laneRect = lane.getBoundingClientRect();
      let tapFrame = Math.round((e.clientX - laneRect.left)/CELL_W);
      tapFrame = Math.max(0, Math.min(frameCount()-1, tapFrame));
      S.frame = tapFrame;
      const startX = e.clientX;
      const origStart = clip.startFrame;
      const frameAtDown = S.frame;
      const activeLayerAtDown = S.activeLayer;
      let moved = false;
      try{ box.setPointerCapture(e.pointerId); }catch(err){}


      const onMove = ev => {
        ev.preventDefault();
        const dFrames = Math.round((ev.clientX - startX)/CELL_W);
        const next = clampClipStart(clip, origStart + dFrames);
        if(next !== clip.startFrame){
          moved = true;
          clip.startFrame = next;
          refreshClipFrames(clip);
          // move only this clip's DOM node — no timeline re-render, so the
          // Layer grid's current frame / active cell stay untouched
          box.style.left = (clip.startFrame*CELL_W) + "px";
        }
      };
      const onUp = ev => {
        window.removeEventListener("pointermove", onMove, true);
        window.removeEventListener("pointerup", onUp, true);
        window.removeEventListener("pointercancel", onUp, true);
        if(ev){ ev.stopPropagation(); if(ev.stopImmediatePropagation) ev.stopImmediatePropagation(); }
        // swallow the synthetic click that follows the drag so it can never
        // reach an xsheet cell underneath
        const swallow = ce => { ce.stopPropagation(); ce.preventDefault(); };
        window.addEventListener("click", swallow, true);
        setTimeout(() => window.removeEventListener("click", swallow, true), 0);
        // audio drag must never change the playhead / active layer
        S.frame = frameAtDown;
        S.activeLayer = activeLayerAtDown;
        const need = clipEndFrame(clip);
        if(need > frameCount()) ensureFrameCount(need);
        renderAll();
        saveAudioClips(true);

      };
      window.addEventListener("pointermove", onMove, true);
      window.addEventListener("pointerup", onUp, true);
      window.addEventListener("pointercancel", onUp, true);
    };


    box.onpointerdown = beginDrag;

    lane.appendChild(box);

  });

  if(sel){
    const durF = clipDurationFrames(sel);
    const canSplit = S.frame > sel.startFrame && S.frame < sel.startFrame + durF;
    if(canSplit){
      const btn = el("button", "audio-split-btn", "✂");
      btn.title = "প্লেহেডে ক্লিপ ভাগ করো";
      btn.style.left = (S.frame*CELL_W) + "px";
      btn.onpointerdown = e => { e.stopPropagation(); e.preventDefault(); };
      btn.onclick = e => {
        e.stopPropagation();
        splitAudioClipAtFrame(sel.id, S.frame);
      };
      lane.appendChild(btn);
    }
  }


  if(!S.audioClips.length || S.focus !== 'audio'){ audioRow.appendChild(lane); return audioRow; }

  const playhead = el("div", "audio-playhead");
  playhead.style.left = (S.frame*CELL_W + 17) + "px";
  const phGrip = el("div", "ph-grip");
  const phKnob = el("div", "ph-knob");
  playhead.appendChild(phGrip);
  playhead.appendChild(phKnob);
  phGrip.onpointerdown = e => {
    e.stopPropagation();
    e.preventDefault();
    stopAudioPlayback();
    playhead.classList.add("dragging");
    try{ phGrip.setPointerCapture(e.pointerId); }catch(err){}
    const laneRect = lane.getBoundingClientRect();
    const total = frameCount();
    const apply = (ev, scrub) => {
      const x = ev.clientX - laneRect.left;
      const f = Math.max(0, Math.min(total-1, Math.round((x - 17)/CELL_W)));
      if(f !== S.frame){
        S.frame = f;
        playhead.style.left = (f*CELL_W + 17) + "px";
        updateFrameCounter();
        updateTimelineActive();
        paint();
        if(scrub) scrubAudioAtFrame(f, false);
      }
    };
    apply(e, false);
    scrubLastFrame = S.frame;
    const onMove = ev => apply(ev, true);
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      playhead.classList.remove("dragging");
      endAudioScrub();
      renderAll();
    };

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
  lane.appendChild(playhead);

  audioRow.appendChild(lane);
  return audioRow;
}

function renderAllObjectsPanel(){
  // বর্তমান প্রজেক্টের layer-এ নেই এমন leftover object থাকলে ছেঁটে ফেলা হয়
  const validLayerIds = new Set(S.layers.map(l=>l.id));
  if(S.imageObjects.some(o=>!validLayerIds.has(o.layerId))){
    S.imageObjects = S.imageObjects.filter(o=>validLayerIds.has(o.layerId));
  }
  if(S.imageObjects.length===0) return null;

  const panel = el("div", "panel");
  panel.appendChild(el("div", "label", `সব ইমেজ OBJECT (${S.imageObjects.length})`));

  const list = document.createElement("div");
  list.style.cssText = "display:flex;flex-direction:column;gap:.35rem;margin-top:.4rem;";

  S.imageObjects.forEach(o=>{
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:.4rem;";

    const lo = S.layers.find(l=>l.id===o.layerId);
    const isSel = o.id===S.selectedObjectId;
    const shapeCount = (o.shapes||[]).length;
    const label = (lo ? lo.name : "?") + (o.group ? ` [${o.group}]` : "") + (o.parentId ? " 🔗" : "") + ` · ${o.keyframes.length}kf` + (shapeCount ? ` · ${shapeCount+1} shape` : "");

    const btn = el("button", `chip compact-btn${isSel ? " chip-accent" : ""}`, label);
    btn.style.flex = "1";
    btn.onclick = () => {
      focusLayer();
      S.selectedObjectId = o.id;
      const li = S.layers.findIndex(l=>l.id===o.layerId);
      if(li>=0) S.activeLayer = li;
      renderAll();
    };
    row.appendChild(btn);

    const delBtn = el("button", "chip compact-btn chip-danger", "✕");
    delBtn.onclick = () => {
      commit((ls,objs) => ({ imageObjects: clearDanglingParents(objs.filter(x=>x.id!==o.id)) }));
      if(S.selectedObjectId===o.id) S.selectedObjectId = null;
      renderAll();
    };
    row.appendChild(delBtn);

    list.appendChild(row);
  });

  panel.appendChild(list);
  return panel;
}

function toggleObjectFlip(axis){
  const obj = S.imageObjects.find(o=>o.id===S.selectedObjectId);
  if(!obj) return;
  const preState = { layers: S.layers, imageObjects: cloneImageObjects(S.imageObjects) };
  const kf = getOrCreateKeyframeAtCurrentFrame(obj);
  if(axis==="x") kf.flipX = !kf.flipX;
  else kf.flipY = !kf.flipY;
  past.push(preState);
  if(past.length>40) past.shift();
  future = [];
  autosave();
  renderUndoRedo();
  renderAll();
}

function flipLayerObjects(layerIndex, axis){
  const layer = S.layers[layerIndex];
  if(!layer) return;
  commit((ls, objs) => ({
    imageObjects: objs.map(o => {
      if(o.layerId !== layer.id) return o;
      return {
        ...o,
        keyframes: o.keyframes.map(k => axis==="x" ? { ...k, flipX: !k.flipX } : { ...k, flipY: !k.flipY })
      };
    })
  }));
  renderAll();
}

function setObjectParent(obj, parentId){
  if(parentId === obj.id) return;
  if(parentId){
    let cur = findObjectById(parentId);
    const guard = new Set();
    while(cur){
      if(cur.id===obj.id) return;
      if(guard.has(cur.id)) break;
      guard.add(cur.id);
      cur = cur.parentId ? findObjectById(cur.parentId) : null;
    }
  }
  commit((ls,objs) => ({ imageObjects: objs.map(o => o.id!==obj.id ? o : {
    ...o, parentId: parentId || null, parentBindFrame: parentId ? S.frame : null
  }) }));
  renderAll();
}

function rebindObjectToParent(obj){
  if(!obj.parentId) return;
  commit((ls,objs) => ({ imageObjects: objs.map(o => o.id!==obj.id ? o : { ...o, parentBindFrame: S.frame }) }));
  renderAll();
}

function setObjectGroup(obj, group){
  S.imageObjects = S.imageObjects.map(o => o.id!==obj.id ? o : { ...o, group });
  autosave();
}

function addKeyframeToSelectedObject(){
  const obj = S.imageObjects.find(o=>o.id===S.selectedObjectId);
  if(!obj) return;

  const t = objectTransformAt(obj, S.frame);
  commit((ls,objs) => ({ imageObjects: objs.map(o=>{
    if(o.id!==obj.id) return o;
    const exists = o.keyframes.some(k=>k.frame===S.frame);
    const nk = exists
      ? o.keyframes.map(k => k.frame===S.frame ? { ...k, x:t.x,y:t.y,w:t.w,h:t.h,rotation:t.rotation,opacity:t.opacity,flipX:!!t.flipX,flipY:!!t.flipY } : k)
      : [...o.keyframes, { frame:S.frame, x:t.x,y:t.y,w:t.w,h:t.h,rotation:t.rotation,opacity:t.opacity,flipX:!!t.flipX,flipY:!!t.flipY, easing:"linear" }];
    return { ...o, keyframes: nk };
  }) }));
  renderAll();
}

/* ================= Project Gallery (IndexedDB) ================= */
const PROJ_DB_NAME = "frameo-studio-projects";
const PROJ_STORE = "projects";
let projDbPromise = null;
function openProjDb(){
  if(projDbPromise) return projDbPromise;
  projDbPromise = new Promise((resolve, reject)=>{
    try{
      const req = indexedDB.open(PROJ_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(PROJ_STORE)) db.createObjectStore(PROJ_STORE, { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  }).catch(()=>null);
  return projDbPromise;
}
function projTx(mode){
  return openProjDb().then(db => db ? db.transaction(PROJ_STORE, mode).objectStore(PROJ_STORE) : null);
}
function idbReq(req){
  return new Promise(resolve=>{
    if(!req) return resolve(null);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
/* ---- Local (IndexedDB) store ---- */
async function localListProjects(){
  const store = await projTx("readonly");
  if(!store) return [];
  const rows = await idbReq(store.getAll());
  return (rows||[]).sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
}
async function localGetProject(id){
  const store = await projTx("readonly");
  if(!store) return null;
  return await idbReq(store.get(id));
}
async function localPutProject(rec){
  const store = await projTx("readwrite");
  if(!store) return false;
  await idbReq(store.put(rec));
  return true;
}
async function localDeleteProject(id){
  const store = await projTx("readwrite");
  if(!store) return;
  await idbReq(store.delete(id));
}

async function listProjects(){
  return await localListProjects();
}
async function getProject(id){
  return await localGetProject(id);
}
async function putProject(rec){
  return await localPutProject(rec);
}
async function deleteProject(id){
  await localDeleteProject(id);
}
async function renameProject(rec, name){
  const full = await localGetProject(rec.id);
  if(full) await localPutProject({ ...full, name, updatedAt: Date.now() });
}


async function duplicateProject(id){
  const base = await getProject(id);
  if(!base) return;
  const copyId = uid() + Date.now().toString(36);
  const copy = {
    ...base,
    id: copyId,
    name: base.name + " (Copy)",
    createdAt: Date.now(),
    updatedAt: Date.now(),
    layers: JSON.parse(JSON.stringify(base.layers)),
    imageObjects: JSON.parse(JSON.stringify(base.imageObjects)),
    audioClips: (base.audioClips || []).map(c => ({
      id: c.id,
      fileName: c.fileName,
      samples: c.samples instanceof Float32Array ? new Float32Array(c.samples) : new Float32Array(c.samples || []),
      sampleRate: c.sampleRate,
      fileDuration: c.fileDuration,
      startFrame: c.startFrame,
      trimStart: c.trimStart,
      trimEnd: c.trimEnd,
      volume: c.volume
    }))
  };
  await putProject(copy);
  return copy;
}

function makeThumbnail(){
  try{
    const off = document.createElement("canvas");
    const W = 320, H = Math.round(320 * STAGE_H / STAGE_W);
    off.width = W; off.height = H;
    const c = off.getContext("2d");
    if(!c) return "";
    c.scale(W / STAGE_W, H / STAGE_H);
    renderFrame(c, S.layers, S.imageObjects, 0, STAGE_W, STAGE_H, S.bg);
    return off.toDataURL("image/jpeg", 0.7);
  }catch(e){ return ""; }
}

function serializeAudioClips(){
  return S.audioClips.map(c => ({
    id: c.id, fileName: c.fileName,
    samples: c.samples ? new Float32Array(c.samples) : new Float32Array(0),
    sampleRate: c.sampleRate,
    fileDuration: c.fileDuration, startFrame: c.startFrame,
    trimStart: c.trimStart, trimEnd: c.trimEnd, volume: c.volume
  }));
}
function hydrateAudioClips(rows){
  S.audioClips = (rows||[]).map(r => {
    const clip = { ...r, src: null, objectUrl: null, _buffer: null,
      samples: r.samples instanceof Float32Array ? r.samples : new Float32Array(r.samples || []) };
    refreshClipFrames(clip);
    return clip;
  });
  lastAudioSignature = null;
  let need = 0;
  S.audioClips.forEach(c => { need = Math.max(need, clipEndFrame(c)); });
  if(need > frameCount()) ensureFrameCount(need);
}

function buildProjectRecord(id, name, createdAt){
  return {
    id, name,
    thumbnail: makeThumbnail(),
    layers: JSON.parse(JSON.stringify(S.layers)),
    imageObjects: JSON.parse(JSON.stringify(S.imageObjects)),
    audioClips: serializeAudioClips(),
    fps: S.fps,
    bg: S.bg,
    onion: S.onion, onionBefore: S.onionBefore, onionAfter: S.onionAfter,
    frame: S.frame, activeLayer: S.activeLayer,
    createdAt: createdAt || Date.now(),
    updatedAt: Date.now()
  };
}

let savingProject = false;
/* মেটাডেটা (নাম/তারিখ) — cloud-এ ভারী পুরো রেকর্ড ডাউনলোড না করে হালকা লিস্ট থেকে */
async function getProjectMeta(id){
  const rows = await listProjects();
  return (rows || []).find(r => r.id === id) || null;
}
async function saveCurrentProject(){
  if(!S.currentProjectId || savingProject) return false;
  savingProject = true;
  try{
    const existing = await getProjectMeta(S.currentProjectId);
    if(!existing){ S.currentProjectId = null; return false; }
    await putProject(buildProjectRecord(existing.id, existing.name, existing.createdAt));
    return true;
  }catch(e){ return false; }
  finally{ savingProject = false; }
}

function defaultProjectName(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `Project ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function saveAsNewProject(){
  const name = (prompt("প্রজেক্টের নাম দিন:", defaultProjectName()) || "").trim();
  if(!name) return;
  const id = uid() + Date.now().toString(36);
  await putProject(buildProjectRecord(id, name, Date.now()));
  S.currentProjectId = id;
  autosaveNow();
  S.currentView = "files";
  if(location.hash !== "#files") location.hash = "#files";
  renderGallery();
}

async function startNewProject(){
  if(!confirm("নতুন প্রজেক্ট শুরু করবেন? বর্তমান কাজ সেভ করা না থাকলে হারিয়ে যাবে।")) return;
  stopPlayback();
  S.layers = [emptyLayer("Layer 1", 1)];
  S.imageObjects = [];
  S.audioClips = [];
  S.selectedObjectId = null;
  S.selectedAudioClipId = null;
  S.activeLayer = 0;
  S.frame = 0;
  S.focus = "layer";
  S.view = { z: 1, x: 0, y: 0 };
  S.currentProjectId = null;
  past = []; future = [];
  lastAudioSignature = null;
  autosaveNow();
  closeGallery();
  renderAll();
  paint();
}

let projectLoadVersion = 0;
async function loadProject(id){
  const loadVersion = ++projectLoadVersion;
  const rec = await getProject(id);
  if(!rec || loadVersion !== projectLoadVersion) return;
  stopPlayback();
  // প্রজেক্ট switch সবসময় clean state থেকে শুরু করে; আগের project-এর object বা
  // selection কোনো async load-এর মাঝেও UI/state-এ বেঁচে থাকতে পারবে না।
  S.imageObjects = [];
  S.selectedObjectId = null;
  const nextLayers = Array.isArray(rec.layers)
    ? JSON.parse(JSON.stringify(rec.layers))
    : [];
  S.layers = nextLayers.length ? nextLayers : [emptyLayer("Layer 1", 1)];
  // ফ্রেমের ভেতরে পুরনো image-stroke reference থাকলে বাদ
  S.layers = S.layers.map(l => ({
    ...l,
    frames: (l.frames || []).map(f => (f || []).filter(s => s.tool !== "image"))
  }));
  const nextImageObjects = Array.isArray(rec.imageObjects)
    ? JSON.parse(JSON.stringify(rec.imageObjects))
    : [];
  // নতুন project-এর snapshot দিয়ে সম্পূর্ণ replacement; append/merge নয়।
  S.imageObjects = sanitizeImageObjects(nextImageObjects, S.layers);
  hydrateAudioClips(rec.audioClips);
  if(Number.isFinite(rec.fps)) S.fps = rec.fps;
  if(typeof rec.bg === "string") S.bg = rec.bg;
  if(typeof rec.onion === "boolean") S.onion = rec.onion;
  if(Number.isFinite(rec.onionBefore)) S.onionBefore = rec.onionBefore;
  if(Number.isFinite(rec.onionAfter)) S.onionAfter = rec.onionAfter;
  S.activeLayer = Math.max(0, Math.min(S.layers.length-1, rec.activeLayer || 0));
  S.frame = Math.max(0, Math.min(frameCount()-1, rec.frame || 0));
  S.selectedAudioClipId = null;
  S.focus = "layer";
  S.currentProjectId = id;
  past = []; future = [];
  autosaveNow();
  closeGallery();
  renderAll();
  paint();
  // সব ছবি decode হওয়ার পর আবার render, যাতে canvas ফাঁকা না দেখায়
  await preloadImageObjectSources(S.imageObjects);
  if(loadVersion !== projectLoadVersion) return;
  renderAll();
  paint();
}




const galleryOverlay = document.getElementById("galleryOverlay");
const galleryGrid = document.getElementById("galleryGrid");
const galleryEmpty = document.getElementById("galleryEmpty");

function fmtProjDate(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let openMenuId = null;

async function renderGallery(){
  
  const rows = await listProjects();
 
  const upd = document.getElementById("btnGalleryUpdate");
  if(upd) upd.classList.toggle("hidden", !rows.some(r => r.id === S.currentProjectId));
  galleryGrid.innerHTML = "";
  galleryEmpty.classList.toggle("hidden", rows.length > 0);
  rows.forEach(rec => {
    const card = el("div", "proj-card" + (rec.id === S.currentProjectId ? " current" : ""));
    const img = document.createElement("img");
    img.className = "proj-thumb";
    img.alt = rec.name;
    if(rec.thumbnail) img.src = rec.thumbnail;
    card.appendChild(img);
    const meta = el("div", "proj-meta");
    meta.appendChild(el("div", "proj-name", rec.name));
    meta.appendChild(el("div", "proj-date", fmtProjDate(rec.updatedAt)));
    card.appendChild(meta);

    const menuBtn = document.createElement("button");
    menuBtn.className = "proj-menu-btn";
    menuBtn.textContent = "⋮";
    card.appendChild(menuBtn);

    menuBtn.onclick = (e) => {
      e.stopPropagation();
      openMenuId = (openMenuId === rec.id ? null : rec.id);
      renderGallery();
    };

    if(openMenuId === rec.id){
      const menu = el("div", "proj-menu");
      menu.onclick = (ev) => ev.stopPropagation();
      const ren = document.createElement("button");
      ren.textContent = "✏️ Rename";
      ren.onclick = async (ev) => {
        ev.stopPropagation();
        openMenuId = null;
        renderGallery();
        const nm = (prompt("নতুন নাম:", rec.name) || "").trim();
        if(!nm) return;
        await renameProject(rec, nm);
        renderGallery();
      };
      const dup = document.createElement("button");
      dup.textContent = "📄 Duplicate";
      dup.onclick = async (ev) => {
        ev.stopPropagation();
        openMenuId = null;
        renderGallery();
        await duplicateProject(rec.id);
        renderGallery();
      };
      const del = document.createElement("button");
      del.textContent = "🗑️ Delete";
      del.onclick = async (ev) => {
        ev.stopPropagation();
        openMenuId = null;
        renderGallery();
        if(!confirm(`"${rec.name}" মুছে ফেলবেন?`)) return;
        await deleteProject(rec.id);
        if(S.currentProjectId === rec.id){ S.currentProjectId = null; autosaveNow(); }
        renderGallery();
      };
      menu.appendChild(ren);
      menu.appendChild(dup);
      menu.appendChild(del);
      card.appendChild(menu);
    }

    card.onclick = () => {
      if(openMenuId !== null){
        openMenuId = null;
        renderGallery();
        return;
      }
      loadProject(rec.id);
    };
    galleryGrid.appendChild(card);
  });
}

galleryOverlay.addEventListener('click', (e) => {
  if(!openMenuId) return;
  if(e.target.closest('.proj-menu') || e.target.closest('.proj-menu-btn')) return;
  openMenuId = null;
  renderGallery();
});

function openGallery(){
  galleryOverlay.classList.remove("hidden");
  S.currentView = "files";
  if(location.hash !== "#files") location.hash = "#files";
  autosaveNow();
  renderGallery();
}
function closeGallery(){
  galleryOverlay.classList.add("hidden");
  S.currentView = "canvas";
  if(location.hash === "#files") location.hash = "#canvas";
  autosaveNow();
}

/* রিফ্রেশ/Back-Forward-এ সঠিক ভিউ পুনরুদ্ধার */
function applyCurrentView(){
  if(S.currentView === "files") openGallery();
  else closeGallery();
}
window.addEventListener("hashchange", () => {
  const want = location.hash === "#files" ? "files" : "canvas";
  if(want === S.currentView) return;
  S.currentView = want;
  applyCurrentView();
});

document.getElementById("btnProjects").onclick = () => { autosaveNow(); openGallery(); };
document.getElementById("btnGalleryClose").onclick = closeGallery;
document.getElementById("btnGalleryNew").onclick = startNewProject;
document.getElementById("btnGallerySaveAs").onclick = saveAsNewProject;
document.getElementById("btnGalleryUpdate").onclick = async () => {
  if(!S.currentProjectId) return;
  const rec = await getProjectMeta(S.currentProjectId);
  if(!rec){ S.currentProjectId = null; renderGallery(); return; }
  if(!confirm(`"${rec.name}" ফাইলটি বর্তমান কাজ দিয়ে আপডেট করবেন?`)) return;
  await saveCurrentProject();
  S.currentView = "files";
  if(location.hash !== "#files") location.hash = "#files";
  renderGallery();
};

tryRestore();
if(location.hash === "#files") S.currentView = "files";
else if(location.hash === "#canvas") S.currentView = "canvas";
renderAll();
applyCurrentView();
// রিস্টোরের পর ছবিগুলো decode করে আবার render
preloadImageObjectSources(S.imageObjects).then(()=>{ renderAll(); paint(); }).catch(()=>{});

requestAnimationFrame(resizeCanvas);
window.addEventListener("resize", resizeCanvas);

// অডিও ক্লিপ IndexedDB থেকে ফিরিয়ে আনো
restoreAudioClips().then(ok => {
  if(!ok) return;
  if(S.selectedAudioClipId && !S.audioClips.some(c=>c.id===S.selectedAudioClipId)) S.selectedAudioClipId = null;
  renderAll();
}).catch(()=>{ audioRestoreDone = true; });

// ট্যাব বন্ধ/লুকানোর আগে সাথে সাথে সেভ
window.addEventListener("beforeunload", autosaveNow);
window.addEventListener("pagehide", autosaveNow);
document.addEventListener("visibilitychange", () => { if(document.hidden) autosaveNow(); });


})();
</script>
