function renderObjectPanel(){
  const root = document.getElementById("panelContent");
  root.innerHTML = "";
  if(S.tool !== "select") return;

  const panel = el("div", "panel");
  const obj = S.imageObjects.find(o=>o.id===S.selectedObjectId);

  if(!obj){
    panel.appendChild(el("div", "label", "IMAGE OBJECT"));
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:.72rem;color:var(--muted-foreground);margin-top:.4rem;";
    hint.textContent = "ক্যানভাসে একটা ইমেজ object ট্যাপ করে সিলেক্ট করো, অথবা Import Gallery দিয়ে নতুন ইমেজ যোগ করো।";
    panel.appendChild(hint);
    root.appendChild(panel);
    const allPanel = renderAllObjectsPanel();
    if(allPanel) root.appendChild(allPanel);
    return;
  }

  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;gap:.4rem;";
  header.appendChild(el("div", "label", "IMAGE OBJECT · " + (function(){
    const lo = S.layers.find(l=>l.id===obj.layerId);
    return lo ? lo.name : "";
  })()));
  const delObjBtn = el("button", "chip chip-danger compact-btn ml-auto", "Delete Object");
  delObjBtn.onclick = () => {
    commit((ls,objs) => ({ imageObjects: clearDanglingParents(objs.filter(o=>o.id!==obj.id)) }));
    S.selectedObjectId = null;
    renderAll();
  };
  header.appendChild(delObjBtn);
  panel.appendChild(header);

  const parentField = el("div", "field");
  parentField.appendChild(el("div", "label", "PARENT (কোন object-এর সাথে লিংক)"));
  const parentRow = el("div", "layer-item-row");
  parentRow.style.marginTop = ".35rem";

  const parentSel = document.createElement("select");
  parentSel.style.cssText = "flex:1;font-size:.68rem;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:6px;padding:.3rem;";
  const noneOpt = document.createElement("option");
  noneOpt.value = "";
  noneOpt.textContent = "কোনো Parent নেই";
  if(!obj.parentId) noneOpt.selected = true;
  parentSel.appendChild(noneOpt);
  S.imageObjects.filter(o=>o.id!==obj.id).forEach(o=>{
    const lo = S.layers.find(l=>l.id===o.layerId);
    const opt = document.createElement("option");
    opt.value = o.id;
    opt.textContent = (lo ? lo.name : "?") + (o.group ? ` [${o.group}]` : "") + ` #${o.id.slice(0,4)}`;
    if(obj.parentId===o.id) opt.selected = true;
    parentSel.appendChild(opt);
  });
  parentSel.onchange = (e) => { setObjectParent(obj, e.target.value || null); };
  parentRow.appendChild(parentSel);
  parentField.appendChild(parentRow);

  if(obj.parentId){
    const rebindRow = el("div", "layer-item-row");
    rebindRow.style.marginTop = ".3rem";
    const rebindBtn = el("button", "chip compact-btn flex-1", "এই ফ্রেমে আবার Bind করো");
    rebindBtn.title = "এখন থেকে এই ফ্রেমের pose-কেই parent-এর 'বেস' পোজ ধরা হবে";
    rebindBtn.onclick = () => rebindObjectToParent(obj);
    rebindRow.appendChild(rebindBtn);
    parentField.appendChild(rebindRow);
  }
  panel.appendChild(parentField);

  const groupField = el("div", "field");
  groupField.appendChild(el("div", "label", "GROUP (যেমন: mouth, eye)"));
  const groupInput = document.createElement("input");
  groupInput.type = "text";
  groupInput.value = obj.group || "";
  groupInput.placeholder = "যেমন: mouth";
  groupInput.style.cssText = "width:100%;margin-top:.35rem;padding:.35rem .4rem;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:6px;font-size:.68rem;";
  groupInput.oninput = (e) => setObjectGroup(obj, e.target.value);
  groupField.appendChild(groupInput);
  panel.appendChild(groupField);

  const shapeField = el("div", "field");
  shapeField.appendChild(el("div", "label", "শেপ লাইব্রেরি (একাধিক ঠোঁট/এক্সপ্রেশন)"));

  const shapeHint = document.createElement("div");
  shapeHint.style.cssText = "font-size:.65rem;color:var(--muted-foreground);margin-top:.3rem;";
  shapeHint.textContent = "একাধিক শেপ আপলোড করো, তারপর যে ফ্রেমে যে শেপ দরকার সেটাতে ট্যাপ করলেই এই object-এর জায়গায় সেটা বসে যাবে।";
  shapeField.appendChild(shapeHint);

  const shapeGrid = document.createElement("div");
  shapeGrid.style.cssText = "display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem;";

  const activeShape = resolveActiveShape(obj, S.frame);
  shapeGrid.appendChild(buildShapeThumb({ id:"base", src:obj.src }, activeShape.id==="base", obj));

  (obj.shapes||[]).forEach(s => {
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;";
    wrap.appendChild(buildShapeThumb(s, activeShape.id===s.id, obj));
    const rm = el("button", "chip compact-btn chip-danger", "✕");
    rm.style.cssText = "position:absolute;top:-6px;right:-6px;width:1.1rem;height:1.1rem;padding:0;border-radius:999px;font-size:.55rem;";
    rm.title = "লাইব্রেরি থেকে এই শেপ মুছে ফেলো";
    rm.onclick = (e) => { e.stopPropagation(); removeShapeFromLibrary(obj, s.id); };
    wrap.appendChild(rm);
    shapeGrid.appendChild(wrap);
  });

  const addShapeBtn = el("button", "chip compact-btn", "+ শেপ যোগ করো");
  addShapeBtn.style.cssText = "width:56px;height:56px;";
  addShapeBtn.onclick = () => {
    pendingShapeTargetObjId = obj.id;
    document.getElementById("shapeInput").click();
  };
  shapeGrid.appendChild(addShapeBtn);

  shapeField.appendChild(shapeGrid);

  if((obj.shapeKeyframes||[]).length){
    const curSk = (obj.shapeKeyframes||[]).find(k=>k.frame===S.frame);
    if(curSk){
      const clearRow = el("div", "layer-item-row");
      clearRow.style.marginTop = ".35rem";
      const clearBtn = el("button", "chip compact-btn flex-1", "এই ফ্রেমের শেপ-বদল মুছো");
      clearBtn.onclick = () => {
        commit((ls,objs) => ({ imageObjects: objs.map(o => o.id!==obj.id ? o : {
          ...o, shapeKeyframes: (o.shapeKeyframes||[]).filter(k=>k.frame!==S.frame)
        }) }));
        renderAll();
      };
      clearRow.appendChild(clearBtn);
      shapeField.appendChild(clearRow);
    }
  }

  panel.appendChild(shapeField);

  const curT = objectTransformAt(obj, S.frame);

  const flipField = el("div", "field");
  flipField.appendChild(el("div", "label", "FLIP (এই ফ্রেমে)"));
  const flipRow = el("div", "layer-item-row");
  flipRow.style.marginTop = ".35rem";

  const flipHBtn = el("button", `chip compact-btn flex-1${curT.flipX ? " chip-accent" : ""}`, "↔ Flip H");
  flipHBtn.onclick = () => toggleObjectFlip("x");
  flipRow.appendChild(flipHBtn);

  const flipVBtn = el("button", `chip compact-btn flex-1${curT.flipY ? " chip-accent" : ""}`, "↕ Flip V");
  flipVBtn.onclick = () => toggleObjectFlip("y");
  flipRow.appendChild(flipVBtn);

  flipField.appendChild(flipRow);
  panel.appendChild(flipField);

  const kfField = el("div", "field");
  const kfs = sortedKeyframes(obj);
  const kfAtPlayhead = obj.keyframes.find(k=>k.frame===S.frame);

  if(kfAtPlayhead){
    const kfHeader = document.createElement("div");
    kfHeader.style.cssText = "display:flex;align-items:center;gap:.4rem;";
    kfHeader.appendChild(el("div", "label", `KEYFRAME #${S.frame+1}`));

    const easingSel = document.createElement("select");
    easingSel.style.cssText = "margin-left:auto;font-size:.62rem;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:4px;padding:2px 4px;";
    Object.keys(EASINGS).forEach(k=>{
      const o = document.createElement("option");
      o.value = k;
      o.textContent = EASING_LABELS[k];
      if(kfAtPlayhead.easing===k) o.selected = true;
      easingSel.appendChild(o);
    });
    easingSel.onchange = (e) => {
      const val = e.target.value;
      commit((ls,objs) => ({ imageObjects: objs.map(o => o.id!==obj.id ? o : {
        ...o, keyframes: o.keyframes.map(k => k.frame===S.frame ? { ...k, easing: val } : k)
      }) }));
      renderAll();
    };
    kfHeader.appendChild(easingSel);

    if(kfs.length>1){
      const delKfBtn = el("button", "chip compact-btn chip-danger", "Delete KF");
      delKfBtn.onclick = () => {
        commit((ls,objs) => ({ imageObjects: objs.map(o => o.id!==obj.id ? o : {
          ...o, keyframes: o.keyframes.filter(k => k.frame!==S.frame)
        }) }));
        renderAll();
      };
      kfHeader.appendChild(delKfBtn);
    }
    kfField.appendChild(kfHeader);
  } else {
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:.68rem;color:var(--muted-foreground);";
    hint.textContent = kfs.length>1
      ? "এই ফ্রেমে keyframe নেই — পাশের keyframe দুটোর মাঝে ইন্টারপোলেটেড মান দেখানো হচ্ছে।"
      : "এখনো একটাই keyframe — এখানে move/scale/rotate করলে অ্যানিমেশনের বদলে পুরো object-ই বদলাবে।";
    kfField.appendChild(el("div", "label", "KEYFRAME"));
    hint.style.marginTop = ".3rem";
    kfField.appendChild(hint);
  }
  panel.appendChild(kfField);

  const opField = el("div", "field");
  const opLabel = el("div", "label", `OPACITY ${Math.round(curT.opacity*100)}%`);
  opField.appendChild(opLabel);
  const opRange = document.createElement("input");
  opRange.type = "range"; opRange.min = 0; opRange.max = 100;
  opRange.value = Math.round(curT.opacity*100);
  opRange.oninput = (e) => {
    const v = Number(e.target.value)/100;
    const kf = getOrCreateKeyframeAtCurrentFrame(obj);
    kf.opacity = v;
    opLabel.textContent = `OPACITY ${e.target.value}%`;
    autosave();
    paint();
  };
  opField.appendChild(opRange);
  opField.appendChild(attachStepper(opRange));
  panel.appendChild(opField);

  const rotField = el("div", "field");
  const rotLabel = el("div", "label", `ROTATION ${Math.round(curT.rotation*180/Math.PI)}°`);
  rotField.appendChild(rotLabel);
  const rotRange = document.createElement("input");
  rotRange.type = "range"; rotRange.min = -180; rotRange.max = 180;
  rotRange.value = Math.round(curT.rotation*180/Math.PI);
  rotRange.oninput = (e) => {
    const v = Number(e.target.value)*Math.PI/180;
    const kf = getOrCreateKeyframeAtCurrentFrame(obj);
    kf.rotation = v;
    rotLabel.textContent = `ROTATION ${e.target.value}°`;
    autosave();
    paint();
  };
  rotField.appendChild(rotRange);
  rotField.appendChild(attachStepper(rotRange));
  panel.appendChild(rotField);

  const sizeField = el("div", "field");
  const curSizePct = Math.round(curT.w*100);
  const sizeLabel = el("div", "label", `SIZE (জুম) ${curSizePct}%`);
  sizeField.appendChild(sizeLabel);
  const sizeRange = document.createElement("input");
  sizeRange.type = "range"; sizeRange.min = 2; sizeRange.max = 400;
  sizeRange.value = curSizePct;
  sizeRange.oninput = (e) => {
    const kf = getOrCreateKeyframeAtCurrentFrame(obj);
    const newW = Math.max(0.02, Number(e.target.value)/100);
    const ratio = newW/kf.w;
    const newH = Math.max(0.02, kf.h*ratio);
    const cx = kf.x + kf.w/2;
    const cy = kf.y + kf.h/2;
    kf.w = newW;
    kf.h = newH;
    kf.x = cx - newW/2;
    kf.y = cy - newH/2;
    sizeLabel.textContent = `SIZE (জুম) ${e.target.value}%`;
    autosave();
    paint();
  };
  sizeField.appendChild(sizeRange);
  sizeField.appendChild(attachStepper(sizeRange));
  panel.appendChild(sizeField);

  const posXField = el("div", "field");
  const curPosXPct = Math.round((curT.x+curT.w/2)*100);
  const posXLabel = el("div", "label", `POSITION X (বামে ↔ ডানে) ${curPosXPct}%`);
  posXField.appendChild(posXLabel);
  const posXRange = document.createElement("input");
  posXRange.type = "range"; posXRange.min = 0; posXRange.max = 100;
  posXRange.value = curPosXPct;
  posXRange.oninput = (e) => {
    const kf = getOrCreateKeyframeAtCurrentFrame(obj);
    const newCx = Number(e.target.value)/100;
    kf.x = newCx - kf.w/2;
    posXLabel.textContent = `POSITION X (বামে ↔ ডানে) ${e.target.value}%`;
    autosave();
    paint();
  };
  posXField.appendChild(posXRange);
  posXField.appendChild(attachStepper(posXRange));
  panel.appendChild(posXField);

  const posYField = el("div", "field");
  const curPosYPct = Math.round((curT.y+curT.h/2)*100);
  const posYLabel = el("div", "label", `POSITION Y (উপরে ↕ নিচে) ${curPosYPct}%`);
  posYField.appendChild(posYLabel);
  const posYRange = document.createElement("input");
  posYRange.type = "range"; posYRange.min = 0; posYRange.max = 100;
  posYRange.value = curPosYPct;
  posYRange.oninput = (e) => {
    const kf = getOrCreateKeyframeAtCurrentFrame(obj);
    const newCy = Number(e.target.value)/100;
    kf.y = newCy - kf.h/2;
    posYLabel.textContent = `POSITION Y (উপরে ↕ নিচে) ${e.target.value}%`;
    autosave();
    paint();
  };
  posYField.appendChild(posYRange);
  posYField.appendChild(attachStepper(posYRange));
  panel.appendChild(posYField);

  root.appendChild(panel);
  const allPanel = renderAllObjectsPanel();
  if(allPanel) root.appendChild(allPanel);
}

function renderAll(){
  renderToolRail();
  renderUndoRedo();
  renderPlayButton();
  updateFrameCounter();

  document.getElementById("btnOnion").className = `chip${S.onion ? " chip-on" : ""}`;
  document.getElementById("btnLoop").className = `chip${S.loop ? " chip-on" : ""}`;
  document.getElementById("btnFpsToggle").textContent = `FPS: ${S.fps}`;
  document.getElementById("fpsLabel").textContent = `Rate: ${S.fps} fps`;
  document.getElementById("fpsRange").value = S.fps;
  const fpsNumInput = document.querySelector("#fpsStepperRow .stepper-input");
  if(fpsNumInput) fpsNumInput.value = S.fps;

  const onionToggleBtn = document.getElementById("btnOnionToggle");
  if(onionToggleBtn){
    onionToggleBtn.textContent = `Onion: ${S.onion ? "ON" : "OFF"}`;
    onionToggleBtn.className = `chip w-full${S.onion ? " chip-accent" : ""}`;
  }
  const onionBeforeLabel = document.getElementById("onionBeforeLabel");
  if(onionBeforeLabel) onionBeforeLabel.textContent = String(S.onionBefore);
  const onionAfterLabel = document.getElementById("onionAfterLabel");
  if(onionAfterLabel) onionAfterLabel.textContent = String(S.onionAfter);
  const onionBeforeNumInput = document.querySelector("#onionBeforeStepperRow .stepper-input");
  if(onionBeforeNumInput) onionBeforeNumInput.value = S.onionBefore;
  const onionAfterNumInput = document.querySelector("#onionAfterStepperRow .stepper-input");
  if(onionAfterNumInput) onionAfterNumInput.value = S.onionAfter;

  renderTopKeyframeButton();
  renderTimeline();
  renderObjectPanel();
  syncAudioToFrame();
  paint();
}

document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;
document.getElementById("btnFirst").onclick = () => { S.frame = 0; renderAll(); };
document.getElementById("btnPrev").onclick = () => { S.frame = Math.max(0, S.frame-1); renderAll(); };
document.getElementById("btnNext").onclick = () => { S.frame = Math.min(frameCount()-1, S.frame+1); renderAll(); };

document.getElementById("btnPlay").onclick = () => {
  S.playing = !S.playing;
  const audioEl = document.getElementById("audioEl");
  if(S.playing){
    startPlayback();
    if(S.audio){
      try{ audioEl.currentTime = S.frame/S.fps; }catch(e){}
      audioEl.play().catch(()=>{});
    }
  } else {
    stopPlayback();
    if(S.audio) audioEl.pause();
  }
  renderAll();
};

document.getElementById("btnFpsToggle").onclick = (e) => {
  e.stopPropagation();
  showFpsDropdown = !showFpsDropdown;
  document.getElementById("fpsDropdown").classList.toggle("hidden", !showFpsDropdown);
};

document.getElementById("fpsDropdown").onclick = (e) => e.stopPropagation();

document.getElementById("fpsRange").oninput = (e) => {
  S.fps = Number(e.target.value);
  document.getElementById("btnFpsToggle").textContent = `FPS: ${S.fps}`;
  document.getElementById("fpsLabel").textContent = `Rate: ${S.fps} fps`;
  autosave();
};

document.getElementById("fpsStepperRow").appendChild(attachStepper(document.getElementById("fpsRange")));

document.getElementById("btnOnion").onclick = (e) => {
  e.stopPropagation();
  showOnionDropdown = !showOnionDropdown;
  document.getElementById("onionDropdown").classList.toggle("hidden", !showOnionDropdown);
};
document.getElementById("onionDropdown").onclick = (e) => e.stopPropagation();

document.getElementById("btnOnionToggle").onclick = () => {
  S.onion = !S.onion;
  const btn = document.getElementById("btnOnionToggle");
  btn.textContent = `Onion: ${S.onion ? "ON" : "OFF"}`;
  btn.className = `chip w-full${S.onion ? " chip-accent" : ""}`;
  document.getElementById("btnOnion").className = `chip${S.onion ? " chip-on" : ""}`;
  autosave();
  paint();
};

const onionBeforeRange = document.createElement("input");
onionBeforeRange.type = "range";
onionBeforeRange.min = 0;
onionBeforeRange.max = 8;
onionBeforeRange.value = S.onionBefore;
onionBeforeRange.oninput = (e) => {
  S.onionBefore = Number(e.target.value);
  const lbl = document.getElementById("onionBeforeLabel");
  if(lbl) lbl.textContent = e.target.value;
  autosave();
  paint();
};
document.getElementById("onionBeforeStepperRow").appendChild(attachStepper(onionBeforeRange));

const onionAfterRange = document.createElement("input");
onionAfterRange.type = "range";
onionAfterRange.min = 0;
onionAfterRange.max = 8;
onionAfterRange.value = S.onionAfter;
onionAfterRange.oninput = (e) => {
  S.onionAfter = Number(e.target.value);
  const lbl = document.getElementById("onionAfterLabel");
  if(lbl) lbl.textContent = e.target.value;
  autosave();
  paint();
};
document.getElementById("onionAfterStepperRow").appendChild(attachStepper(onionAfterRange));

document.getElementById("btnLoop").onclick = () => { S.loop = !S.loop; renderAll(); };
document.getElementById("btnAddKeyframeTop").onclick = addKeyframeToSelectedObject;
document.getElementById("btnAddFrame").onclick = addFrame;
document.getElementById("btnDupFrame").onclick = duplicateFrame;
document.getElementById("btnCopy").onclick = copyCurrentFrame;
document.getElementById("btnPaste").onclick = pasteToCurrentFrame;
document.getElementById("btnClear").onclick = clearFrame;
document.getElementById("btnDelFrame").onclick = deleteFrame;

const exportDropdown = document.getElementById("exportDropdown");
document.getElementById("btnExportTab").onclick = (e) => {
  e.stopPropagation();
  exportDropdown.classList.toggle("hidden");
};

document.addEventListener("click", () => { exportDropdown.classList.add("hidden"); });

document.getElementById("b4k").onclick = () => { exportDropdown.classList.add("hidden"); exportVideo(2); };
document.getElementById("b1080").onclick = () => { exportDropdown.classList.add("hidden"); exportVideo(1); };
document.getElementById("bpng").onclick = () => { exportDropdown.classList.add("hidden"); exportPng(); };

document.getElementById("btnImportGallery").onclick = () => { document.getElementById("photoInput").click(); };

document.getElementById("photoInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  importPhoto(file).catch(err => {
    console.error("ছবি ইমপোর্ট ব্যর্থ:", err);
    alert("ছবি যোগ করতে সমস্যা হয়েছে: " + (err && err.message ? err.message : String(err)));
  });
  e.target.value = "";
});

document.getElementById("btnImportAudio").onclick = () => { document.getElementById("audioInput").click(); };

document.getElementById("audioInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  importAudioFile(file).catch(err => {
    console.error("অডিও ইমপোর্ট ব্যর্থ:", err);
    alert("অডিও যোগ করতে সমস্যা হয়েছে: " + (err && err.message ? err.message : String(err)));
  });
  e.target.value = "";
});

document.getElementById("shapeInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  const targetId = pendingShapeTargetObjId;
  pendingShapeTargetObjId = null;
  const obj = targetId ? S.imageObjects.find(o=>o.id===targetId) : null;
  if(file && obj){
    addShapeToLibrary(obj, file).catch(err => {
      console.error("শেপ যোগ করা ব্যর্থ:", err);
      alert("শেপ যোগ করতে সমস্যা হয়েছে: " + (err && err.message ? err.message : String(err)));
    });
  }
  e.target.value = "";
});

tryRestore();
renderAll();
requestAnimationFrame(resizeCanvas);
window.addEventListener("resize", resizeCanvas);

})();
</script>

</body>
</html>
